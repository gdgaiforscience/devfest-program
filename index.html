 Cham. https://doi.org/10.1007/978-3-032-36036-6_17 \n\n2) Code: https://github.com/SammyGbabs/FaunaPulse-Capstone-Project\n\n3) Dataset: Metcalf et al. (2023). Listening to Tropical Forest Soils. bioRxiv. https://doi.org/10.1101/2023.05.19.541323", "bio": "Samuel Babalola is an AI/ML researcher and engineer whose work focuses on building AI systems that stay reliable in real-world, low-resource settings, with research spanning robustness under distribution shift, reinforcement learning, computer vision, bioacoustics, and AI for health. He is the AI & LLM Lead for Aurah AI at Yield Haven LLC and an AI/ML Researcher at Ruzivo Research Lab, where he leads the Robust & Adaptive Systems pod. He also leads the Edge AI focus group at ML Collective and supports health research at ALU’s Center for Health Innovation and Impact. His work on AI-powered soil biodiversity monitoring using bioacoustics received a Top Poster Award at Research in Africa Days (RIAD), Deep Learning Indaba 2026 in Lagos, and was presented at ICICT 2026 (Springer). He also has work accepted at the GlobalSouthCV Workshop at BMVC 2026 and serves as a peer reviewer for ML4H 2026. He holds a BSc in Software Engineering (Machine Learning) from the African Leadership University.", "resourceLinks": [{"url": "https://doi.org/10.1007/978-3-032-36036-6_17", "label": "Website"}, {"url": "https://github.com/SammyGbabs/FaunaPulse-Capstone-Project", "label": "GitHub"}, {"url": "https://doi.org/10.1101/2023.05.19.541323", "label": "Website"}], "speakerLinks": [{"url": "https://www.linkedin.com/in/sammybabs/", "label": "LinkedIn"}, {"url": "https://github.com/SammyGbabs", "label": "GitHub"}]}, {"id": "s40", "kind": "session", "day": 2, "block": "Block 2D: Healthcare Innovation, Bioacoustics & Responsible AI", "startUtc": "2026-11-28T10:00:00Z", "endUtc": "2026-11-28T10:20:00Z", "aedt": "9:00 PM - 9:20 PM", "jst": "7:00 PM - 7:20 PM", "ist": "3:30 PM - 3:50 PM", "mins": 20, "format": "Talk", "speaker": "Dr. Houda Chihi", "designation": "Senior Researcher", "affiliation": "InnovCOM SupCOM", "title": "AI Agents For Network Management Sustainability", "tracks": ["AI → Science"], "abstract": "The idea is to propose AI Agents for managing the network taking into consideration governance & Sustainability. The talk proposes a multi-layered conceptual architecture in which governance and sustainability are native architectural properties rather than post-hoc additions. The architecture distinguishes three cooperating layers: a Strategic Orchestration Layer that translates business intents and sustainability targets into regulation-aligned policies; an Operational Coordination Layer that distributes tasks among agents, mediates between local autonomy and global policy, and contains faults; and a Distributed Execution Layer in which specialized agents act on network infrastructure under tool-call level enforcement with complete audit logging. Defined governance interfaces between adjacent layers carry policies downward and audit evidence upward, while sustainability telemetry feeds energy and carbon indicators back to the strategic level.", "bio": "PhD in telecom, senior researcher at InnovCOM Lab of Sup'COM Tunisia, techwomen fellow 2019 hosted at Qualcomm California, Eugen Ionescu postdoc fellow2021 hosted at polytechnica university of Bucharest, international speaker & trainer and member in many associations about women in tech. My research focus is on AI, cybersecurity and internet governance. I am also an ICANN & IETF Fellow.", "resourceLinks": [], "speakerLinks": []}, {"id": "s41", "kind": "session", "day": 2, "block": "Block 2D: Healthcare Innovation, Bioacoustics & Responsible AI", "startUtc": "2026-11-28T10:20:00Z", "endUtc": "2026-11-28T10:40:00Z", "aedt": "9:20 PM - 9:40 PM", "jst": "7:20 PM - 7:40 PM", "ist": "3:50 PM - 4:10 PM", "mins": 20, "format": "Talk", "speaker": "Ms. Babzzine Roufaida", "designation": "PhD Student in Generative AI Optimization", "affiliation": "EIGSI Casablanca, Morocco; 2IACS Laboratory, ENSET Mohammedia, Hassan II University of Casablanca", "title": "Beyond Accuracy: Measuring and Reducing the Environmental Footprint of Large Language Models", "tracks": ["Science → AI"], "abstract": "As Large Language Models (LLMs) become increasingly integrated into scientific research and real-world applications, their computational demands raise important questions about energy efficiency, environmental sustainability, and responsible AI development.\n\nWhile traditional evaluation focuses primarily on model accuracy and task performance, a broader perspective is needed to understand the environmental implications of training, fine-tuning, and deploying these systems.\n\nDrawing on a systematic literature review of energy-efficient LLM optimization strategies, this session explores the key factors influencing computational energy consumption and carbon emissions. It introduces a structured perspective on optimization approaches, including model compression, parameter-efficient fine-tuning, quantization, and inference optimization.\n\nThe session will also discuss the challenges of comparing energy measurements across studies, the importance of transparent experimental reporting, and the trade-offs between model performance, computational efficiency, and environmental impact.\n\nParticipants will gain a clearer understanding of how to evaluate LLM efficiency beyond traditional performance metrics and how to incorporate sustainability considerations into AI research and development.\n\nKey takeaways:\n\n-Understanding the main sources of energy consumption in LLM workflows.\n\n-Exploring optimization strategies and their practical trade-offs.\n\n-Identifying limitations in current energy and carbon reporting practices.\n\n-Introducing a more systematic approach to evaluating sustainable AI systems.", "bio": "Roufaida Babzzine is a PhD researcher at EIGSI Casablanca, Morocco, affiliated with the 2IACS Laboratory at ENSET Mohammedia, Hassan II University. She holds an engineering degree in Industrial Digital Transformation.\n\nHer research focuses on the computational optimization of generative artificial intelligence, with particular interest in energy-efficient Large Language Models, sustainable AI, and resource-aware optimization strategies.\n\nHer scientific work includes a systematic literature review on energy-efficient LLM optimization, examining optimization techniques, environmental impact assessment, and transparent reporting practices.\n\nThrough her research, she aims to contribute to the development of more computationally efficient and environmentally responsible AI systems.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/roufaida-b-407b50243", "label": "LinkedIn"}]}, {"id": "s42", "kind": "session", "day": 2, "block": "Block 2D: Healthcare Innovation, Bioacoustics & Responsible AI", "startUtc": "2026-11-28T10:40:00Z", "endUtc": "2026-11-28T11:00:00Z", "aedt": "9:40 PM - 10:00 PM", "jst": "7:40 PM - 8:00 PM", "ist": "4:10 PM - 4:30 PM", "mins": 20, "format": "Talk", "speaker": "Mr. Ankit Mathur", "designation": "Associate Vice President", "affiliation": "NatWest Group", "title": "Guardrails Before Gains: Responsible AI in Banking", "tracks": ["Responsible AI"], "abstract": "Session is inclined towards responsible adoption of AI as per regulations and laws defined by governments and organisations. The session would be based on the Guardrails/Operational limits which should be applied around AI based applications. This would spread awareness about laws and regulations which AI implementations should abide by and showcase what stages this implementation should follow (at least)", "bio": "I am professional for Artificial Intelligence, Automation and Performance improvements of applications across multiple domains of implementations. I have been part of AI for Science for past few years and attended some events related to DNA mapping, Antigravity for developers and others. My interest is towards responsible adoption of AI as per regulations and laws defined by governments and organisations.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/ankitmathur111", "label": "LinkedIn"}]}, {"id": "s43", "kind": "session", "day": 2, "block": "Block 2D: Healthcare Innovation, Bioacoustics & Responsible AI", "startUtc": "2026-11-28T11:00:00Z", "endUtc": "2026-11-28T11:10:00Z", "aedt": "10:00 PM - 10:10 PM", "jst": "8:00 PM - 8:10 PM", "ist": "4:30 PM - 4:40 PM", "mins": 10, "format": "Lightning / Demo", "speaker": "Mr. Aatmaj Amol Salunke", "designation": "Google Summer of Code Contributor 2026", "affiliation": "ML4SCI", "title": "DLens: Closed Loop AI Agents for Dark Matter Gravitational Lensing", "tracks": ["AI → Science"], "abstract": "DLens is a closed loop AI scientist for studying dark matter through strong gravitational lensing, built as part of ML4SCI’s DeepLense project in Google Summer of Code 2026. Six agents (data simulation, model design, training, inference, analysis, and an experiment planner) work together through typed contracts. The planner searches across six model families, including CNNs, ViTs, and group equivariant networks, then tunes the best candidates. The result: a 1.19M parameter model reaching 92.6% test accuracy versus 90.7% for a 21.28M parameter ResNet-34. We’ll also cover our simulation agent, which turns plain English physics descriptions into validated lenstronomy code, and a surprising finding: LLMs often write code for the wrong version of a library rather than hallucinating outright. Giving the agent a version pinned API cheat sheet raised the pass rate from about 83% to 99%. This work has been accepted for a spotlight talk at the AAAI 2026 Fall Symposium.\n\nCode: https://github.com/ML4SCI/DeepLense-AI-Scientist \nBlog: https://medium.com/@aatmajsalunke/an-ai-scientist-for-dark-matter-closed-loop-agents-for-strong-gravitational-lensing-e6e31a4b13ad", "bio": "I'm an MS in Artificial Intelligence student at Northeastern University's Khoury College, graduating in December 2026. My interest in space science started at ISRO and led me to the DeepLense project with ML4SCI through Google Summer of Code 2026. There I built DLens, a closed loop AI scientist that plans experiments, searches model architectures, and generates physics simulation code to study dark matter through strong gravitational lensing. DLens found a model that beat a standard baseline while using about 18 times fewer parameters, and the work was accepted as a spotlight talk at the AAAI 2026 Fall Symposium.", "resourceLinks": [{"url": "https://github.com/ML4SCI/DeepLense-AI-Scientist", "label": "GitHub"}, {"url": "https://medium.com/@aatmajsalunke/an-ai-scientist-for-dark-matter-closed-loop-agents-for-strong-gravitational-lensing-e6e31a4b13ad", "label": "Article"}], "speakerLinks": [{"url": "https://aatmaj28.github.io/Portfolio/", "label": "Website"}, {"url": "https://www.linkedin.com/in/aatmaj-salunke-7106041b0/", "label": "LinkedIn"}, {"url": "https://github.com/aatmaj28", "label": "GitHub"}, {"url": "https://medium.com/@aatmajsalunke", "label": "Article"}]}, {"kind": "close", "day": 2, "block": "Block 2D: Healthcare Innovation, Bioacoustics & Responsible AI", "startUtc": "2026-11-28T11:10:00Z", "endUtc": "2026-11-28T11:10:00Z", "aedt": "10:10 PM", "jst": "8:10 PM", "ist": "4:40 PM", "mins": 0, "title": "Close of Day 2 · Thank you for joining DevFest 2026!"}];

      try {
        const timeFmt = new Intl.DateTimeFormat('en-US', {
          timeZone: tz,
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        });
        const dateFmt = new Intl.DateTimeFormat('en-US', {
          timeZone: tz,
          weekday: 'short',
          month: 'short',
          day: 'numeric'
        });
        const tzShortFmt = new Intl.DateTimeFormat('en-US', {
          timeZone: tz,
          timeZoneName: 'short'
        });
        const parts = tzShortFmt.formatToParts(s);
        const tzAbbr = (parts.find(p => p.type === 'timeZoneName') || {}).value || '';
        return {
          range: s.getTime() === e.getTime() ? timeFmt.format(s) : `${timeFmt.format(s)} – ${timeFmt.format(e)}`,
          sub: `${dateFmt.format(s)}${tzAbbr ? ' · ' + tzAbbr : ''}`
        };
      } catch (err) {
        return { range: '', sub: '' };
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatInlineMarkdown(str) {
      return escapeHtml(str)
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color:var(--google-blue)">$1</a>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    }

    function highlightText(htmlStr, query) {
      if (!query) return htmlStr;
      const terms = query.trim().split(/\s+/).filter(t => t.length >= 2);
      if (!terms.length) return htmlStr;
      const pattern = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
      const regex = new RegExp(`(${pattern})`, 'gi');
      return htmlStr.replace(/(<[^>]+>|&(?:amp|lt|gt|quot);)|([\s\S]+?(?=<|&(?:amp|lt|gt|quot);|$))/g, (m, skip, txt) =>
        skip ? skip : txt.replace(regex, '<mark>$1</mark>')
      );
    }

    function formatRichAbstract(text, query) {
      const bulletRe = /^(\s*(?:[-•]\s+|\*\s+|-\s*(?=[A-Z])|\d+[.)]\s+))/;
      const paragraphs = String(text || '').split(/\n\s*\n/);
      return paragraphs.map(block => {
        const lines = block.trim().split('\n');
        const isBulletBlock = lines.length > 1 && lines.every(l => bulletRe.test(l));
        if (isBulletBlock) {
          const lis = lines.map(l => {
            const cleanLine = l.replace(bulletRe, '');
            return `<li>${highlightText(formatInlineMarkdown(cleanLine), query)}</li>`;
          }).join('');
          return `<ul>${lis}</ul>`;
        }
        const isHeaderThenBullets = lines.length > 2 && !bulletRe.test(lines[0]) && lines.slice(1).every(l => bulletRe.test(l));
        if (isHeaderThenBullets) {
          const hdr = `<p>${highlightText(formatInlineMarkdown(lines[0].trim()), query)}</p>`;
          const lis = lines.slice(1).map(l => {
            const cleanLine = l.replace(bulletRe, '');
            return `<li>${highlightText(formatInlineMarkdown(cleanLine), query)}</li>`;
          }).join('');
          return `${hdr}<ul>${lis}</ul>`;
        }
        const html = formatInlineMarkdown(block.trim()).replace(/\n/g, '<br>');
        return `<p>${highlightText(html, query)}</p>`;
      }).join('');
    }

    function getFormatClass(fmt) {
      if (fmt === 'Workshop') return 'fmt-workshop';
      if (fmt === 'Talk') return 'fmt-talk';
      if (fmt === 'Interactive Session') return 'fmt-custom';
      return 'fmt-lightning';
    }

    function matchesFilters(item) {
      if (item.kind !== 'session') {
        // Show schedule breaks only when browsing full unfiltered schedule
        if (state.query || state.format !== 'ALL' || state.savedOnly) {
          return false;
        }
        if (state.day !== 'ALL' && String(item.day) !== state.day) {
          return false;
        }
        return true;
      }

      if (state.day !== 'ALL' && String(item.day) !== state.day) return false;
      if (state.savedOnly && !state.savedIds.has(item.id)) return false;
      if (state.format !== 'ALL' && item.format !== state.format) return false;

      if (state.query) {
        const terms = state.query.toLowerCase().trim().split(/\s+/);
        const haystack = [
          item.title,
          item.speaker,
          item.affiliation,
          item.designation,
          item.abstract,
          item.bio,
          item.format,
          item.block,
          (item.tracks || []).join(' ')
        ].join(' ').toLowerCase();
        return terms.every(t => haystack.includes(t));
      }

      return true;
    }

    function render() {
      const container = document.getElementById('programContainer');
      const filtered = PROGRAM_ITEMS.filter(matchesFilters);
      const sessionCount = filtered.filter(i => i.kind === 'session').length;

      // Update summary & reset button visibility
      const hasActiveFilters = state.query || state.day !== 'ALL' || state.format !== 'ALL' || state.savedOnly;
      document.getElementById('resetFiltersBtn').style.display = hasActiveFilters ? 'inline-block' : 'none';
      document.getElementById('resultsSummary').innerHTML =
        sessionCount === TOTAL_SESSIONS && !hasActiveFilters
          ? `Showing all <strong>${TOTAL_SESSIONS}</strong> sessions`
          : `Showing <strong>${sessionCount}</strong> of ${TOTAL_SESSIONS} sessions`;

      if (sessionCount === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No matching sessions found</h3>
            <p>Try broadening your search terms or clearing active format filters.</p>
            <button class="btn-text" onclick="resetAllFilters()">Reset all filters</button>
          </div>
        `;
        return;
      }

      let html = '';
      let currentDay = null;
      let currentBlock = null;

      filtered.forEach(item => {
        if (item.day !== currentDay) {
          if (currentDay !== null) html += `</section>`;
          currentDay = item.day;
          currentBlock = null;
          const dayTitle = item.day === 1
            ? 'Day 1 — Friday, 27 November 2026'
            : 'Day 2 — Saturday, 28 November 2026';
          const daySub = `${PROGRAM_ITEMS.filter(i => i.kind === 'session' && i.day === item.day).length} Confirmed Sessions`;
          html += `
            <section class="day-section">
              <div class="day-banner">
                <h2>${dayTitle}</h2>
                <span>${daySub}</span>
              </div>
          `;
        }

        if (item.block !== currentBlock) {
          currentBlock = item.block;
          html += `<div class="block-header">${escapeHtml(currentBlock)}</div>`;
        }

        const tInfo = formatTimeRange(item.startUtc, item.endUtc);

        if (item.kind !== 'session') {
          const icon = item.kind === 'break' ? '☕' : (item.kind === 'open' ? '🎬' : '🏁');
          html += `
            <div class="marker-row">
              <span class="marker-time">${escapeHtml(tInfo.range || item.aedt)}</span>
              <span>${icon} ${escapeHtml(item.title)}</span>
            </div>
          `;
          return;
        }

        const isExpanded = state.allExpanded || state.expandedIds.has(item.id);
        const isSaved = state.savedIds.has(item.id);

        const titleHtml = highlightText(escapeHtml(item.title), state.query);
        const speakerHtml = highlightText(escapeHtml(item.speaker), state.query);
        const affText = item.affiliation
          ? (item.designation && !item.affiliation.toLowerCase().includes(item.designation.toLowerCase())
            ? `${item.designation}, ${item.affiliation}`
            : item.affiliation)
          : item.designation;
        const affHtml = affText ? highlightText(escapeHtml(affText), state.query) : '';

        const plainAbstract = item.abstract
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '$1')
          .replace(/\*\*/g, '')
          .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1$2')
          .replace(/\s+/g, ' ')
          .trim();
        const previewPlain = escapeHtml(plainAbstract);
        const previewHtml = highlightText(previewPlain, state.query);
        const fullAbstractHtml = formatRichAbstract(item.abstract, state.query);

        const allLinks = [
          ...item.resourceLinks.map(l => ({ ...l, prefix: '📄 ' })),
          ...item.speakerLinks.map(l => ({ ...l, prefix: '🔗 ' }))
        ];
        const linksHtml = allLinks.length
          ? `<div class="links-row">${allLinks.map(l =>
            `<a class="ext-link" href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer">${l.prefix}${escapeHtml(l.label)} ↗</a>`
          ).join('')}</div>`
          : '';

        const bioHtml = item.bio
          ? `<div class="bio-box">
               <div class="bio-label">About the Speaker</div>
               <div>${highlightText(formatInlineMarkdown(item.bio), state.query).replace(/\n\n+/g, '<br><br>')}</div>
             </div>`
          : '';

        html += `
          <article class="session-card ${isExpanded ? 'expanded' : ''} ${isSaved ? 'bookmarked' : ''}" id="card-${item.id}">
            <div class="card-grid">
              <div class="time-col">
                <div>
                  <div class="time-primary">${escapeHtml(tInfo.range || item.aedt)}</div>
                  <div class="time-date-sub">${escapeHtml(tInfo.sub)}</div>
                </div>
                <span class="format-badge ${getFormatClass(item.format)}">${escapeHtml(item.format)} · ${item.mins}m</span>
              </div>

              <div class="content-col">
                <div class="card-top-row">
                  <h3 class="session-title" onclick="toggleCard('${item.id}')">${titleHtml}</h3>
                  <button
                    class="bookmark-btn ${isSaved ? 'active' : ''}"
                    onclick="toggleBookmark('${item.id}', event)"
                    title="${isSaved ? 'Remove from saved sessions' : 'Save session'}"
                    aria-label="Bookmark session"
                  >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                  </button>
                </div>

                <div class="speaker-line">
                  <span class="speaker-name">${speakerHtml}</span>
                  ${affHtml ? `<span>·</span><span class="speaker-aff">${affHtml}</span>` : ''}
                </div>

                <div class="abstract-wrap">
                  <div class="abstract-preview">${previewHtml}</div>
                  <div class="details-panel">
                    <div class="abstract-full">${fullAbstractHtml}</div>
                    ${linksHtml}
                    ${bioHtml}
                  </div>
                </div>

                <div class="card-footer-actions">
                  <button class="toggle-btn" onclick="toggleCard('${item.id}')">
                    ${isExpanded ? 'Hide full abstract ▲' : (item.bio ? 'Read full abstract & speaker bio ▼' : 'Read full abstract ▼')}
                  </button>
                </div>
              </div>
            </div>
          </article>
        `;
      });

      if (currentDay !== null) html += `</section>`;
      container.innerHTML = html;
    }

    window.toggleCard = function (id) {
      if (state.allExpanded) {
        state.allExpanded = false;
        PROGRAM_ITEMS.forEach(i => {
          if (i.kind === 'session' && i.id !== id) state.expandedIds.add(i.id);
        });
        state.expandedIds.delete(id);
        document.getElementById('expandAllBtn').textContent = 'Expand all abstracts';
      } else if (state.expandedIds.has(id)) {
        state.expandedIds.delete(id);
      } else {
        state.expandedIds.add(id);
      }
      render();
    };

    window.toggleBookmark = function (id, ev) {
      ev.stopPropagation();
      if (state.savedIds.has(id)) {
        state.savedIds.delete(id);
      } else {
        state.savedIds.add(id);
      }
      saveBookmarks();
      render();
    };

    window.resetAllFilters = function () {
      state.query = '';
      state.day = 'ALL';
      state.format = 'ALL';
      state.savedOnly = false;

      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.remove('visible');
      document.getElementById('formatSelect').value = 'ALL';
      document.getElementById('savedFilterBtn').classList.remove('active');

      document.querySelectorAll('.day-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.day === 'ALL');
      });

      render();
    };

    // Wire up interactive controls
    document.addEventListener('DOMContentLoaded', () => {
      // Update local timezone label with detected city/code
      try {
        const userTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        if (userTz) {
          const localOpt = document.querySelector('#tzSelect option[value="LOCAL"]');
          localOpt.textContent = `Local Time (${userTz.replace(/_/g, ' ')})`;
        }
      } catch (e) { }

      saveBookmarks();

      const searchInput = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');

      searchInput.addEventListener('input', e => {
        state.query = e.target.value;
        clearBtn.classList.toggle('visible', state.query.length > 0);
        render();
      });

      clearBtn.addEventListener('click', () => {
        state.query = '';
        searchInput.value = '';
        clearBtn.classList.remove('visible');
        searchInput.focus();
        render();
      });

      document.getElementById('formatSelect').addEventListener('change', e => {
        state.format = e.target.value;
        render();
      });

      document.getElementById('tzSelect').addEventListener('change', e => {
        state.tz = e.target.value;
        render();
      });

      document.querySelectorAll('.day-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          state.day = btn.dataset.day;
          document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          render();
        });
      });

      const savedBtn = document.getElementById('savedFilterBtn');
      savedBtn.addEventListener('click', () => {
        state.savedOnly = !state.savedOnly;
        savedBtn.classList.toggle('active', state.savedOnly);
        render();
      });

      const expandAllBtn = document.getElementById('expandAllBtn');
      expandAllBtn.addEventListener('click', () => {
        state.allExpanded = !state.allExpanded;
        state.expandedIds.clear();
        expandAllBtn.textContent = state.allExpanded ? 'Collapse all abstracts' : 'Expand all abstracts';
        render();
      });

      document.getElementById('resetFiltersBtn').addEventListener('click', window.resetAllFilters);

      render();
    });
  </script>
</body>

</html>
