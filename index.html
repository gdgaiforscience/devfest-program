/github.com/masapasa/qcpinn-convection-diffusion-qiskit", "label": "GitHub"}], "speakerLinks": [{"url": "https://quasi.digital", "label": "Website"}, {"url": "https://github.com/adytiaa/quasi.ai", "label": "GitHub"}, {"url": "https://www.linkedin.com/m/in/a-seshaditya-7180822a5/", "label": "LinkedIn"}]}, {"id": "s16", "kind": "session", "day": 1, "block": "Block 1C: Scientific Simulation, Quantum ML & Human-Centric AI", "startUtc": "2026-11-27T07:50:00Z", "endUtc": "2026-11-27T08:10:00Z", "aedt": "6:50 PM - 7:10 PM", "jst": "4:50 PM - 5:10 PM", "ist": "1:20 PM - 1:40 PM", "mins": 20, "format": "Talk", "speaker": "Dr. Yousef Yeganeh", "designation": "Researcher and Lecturer", "affiliation": "Aalto University, Department of Computer Science; CAMP chair, Technical University of Munich (TUM)", "title": "Adapting and Controlling Pretrained Generative Models for Medical Imaging", "tracks": ["AI → Science"], "abstract": "Diffusion models typically require large training sets. Medical imaging rarely offers them, due to acquisition cost and privacy constraints. Pretrained generative models are a natural starting point, but their training distributions differ substantially from medical data. This talk asks how pretrained generative models can be adapted to medical imaging, and how precisely their output can be controlled.\n\nThe session covers two methods. Latent Drifting (CVPR 2025) addresses the distribution gap between pretraining data and medical images. It can be combined with any fine-tuning method or applied at inference time as a conditioning signal. It enables counterfactual generation, for example showing how a scan would change with age, gender, or disease presence. Evaluations on longitudinal brain MRI and chest X-ray datasets report gains across several fine-tuning approaches. Directional Noise Conditioning (NeurIPS 2026) is more recent work in the same direction. It targets finer control over generation and cheap adaptation of pretrained models rather than sample diversity.\n\nThe session closes with open problems in evaluating counterfactual medical images, and the role of controllable generation in data augmentation and simulation for medical AI.\n\nPaper: https://openaccess.thecvf.com/content/CVPR2025/html/Yeganeh_Latent_Drifting_in_Diffusion_Models_for_Counterfactual_Medical_Image_Synthesis_CVPR_2025_paper.html\narXiv: https://arxiv.org/abs/2412.20651", "bio": "Yousef Yeganeh is a researcher and lecturer at the Department of Computer Science, Aalto University. He is also affiliated with the CAMP chair at the Technical University of Munich (TUM), where he completed his PhD. His research connects machine learning with medical imaging. It spans generative models, surgical scene understanding, and network architectures for complex anatomical structures. His recent work focuses on adapting pretrained generative models to medical data and on finer control over what they generate, including Latent Drifting (CVPR 2025) and Directional Noise Conditioning (NeurIPS 2026). He has published at CVPR, ICCV, ECCV, NeurIPS, AAAI, and MICCAI, and co-organizes the GRAIL workshop at MICCAI and the SU2HM workshop series.", "resourceLinks": [{"url": "https://openaccess.thecvf.com/content/CVPR2025/html/Yeganeh_Latent_Drifting_in_Diffusion_Models_for_Counterfactual_Medical_Image_Synthesis_CVPR_2025_paper.html", "label": "Website"}, {"url": "https://arxiv.org/abs/2412.20651", "label": "arXiv"}], "speakerLinks": [{"url": "https://www.linkedin.com/in/yousefyegane", "label": "LinkedIn"}, {"url": "https://x.com/youyegn", "label": "Website"}]}, {"id": "s17", "kind": "session", "day": 1, "block": "Block 1C: Scientific Simulation, Quantum ML & Human-Centric AI", "startUtc": "2026-11-27T08:10:00Z", "endUtc": "2026-11-27T08:30:00Z", "aedt": "7:10 PM - 7:30 PM", "jst": "5:10 PM - 5:30 PM", "ist": "1:40 PM - 2:00 PM", "mins": 20, "format": "Talk", "speaker": "Ms. Kai Park", "designation": "Computational Linguist", "affiliation": "Independent Researcher (Computational Linguistics)", "title": "Beyond Benchmarks: How Empirical Linguistics and Cloud Infrastructure Empower Human-Centric AI Evaluation", "tracks": ["Science → AI"], "abstract": "Standard evaluations of language models often prioritize surface-level task accuracy, overlooking the cognitive constraints and pragmatic subtleties that define human communication. Bridging this gap requires empirical linguistics—yet non-CS researchers frequently face steep computational barriers when attempting to test linguistic hypotheses at scale.   In this talk, we explore how empirical linguistics serves as an indispensable science for AI evaluation, while showcasing a practical blueprint for how domain researchers can execute large-scale experiments without dedicated local hardware. Drawing from empirical studies—ranging from quantifying affective nuances in modal particles to demonstrating that cognitive accuracy does not guarantee affective alignment (presented at EMNLP PANDORA 2026)—we illustrate why linguistic rigor uncovers critical model blind spots. Furthermore, I share my hands-on workflow as an independent researcher navigating complex computing setups—specifically, how I balanced GPU and TPU resources across different experimental stages and utilized agentic coding to resolve low-level compiler errors and automate distributed training pipelines. Attendees will leave with both a scientific rationale for linguistics-driven AI evaluation and a practical perspective on how researchers can design and sustain their own scalable computational workflows.", "bio": "I am a computational linguist investigating how linguistic structures and human cognition can inform language model evaluation. My work combines controlled empirical experiments with quantitative corpus analysis to evaluate where current models align with human cognitive and socio-affective processing. My recent focus centers on using rigorous statistical frameworks and experimental linguistics to build more human-grounded evaluation pipelines for AI.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/bakeyeon/", "label": "LinkedIn"}, {"url": "https://orcid.org/0000-0002-2854-0127", "label": "ORCID"}]}, {"id": "s18", "kind": "session", "day": 1, "block": "Block 1D: Autonomous TPU Pipelines & Reproducible Science", "startUtc": "2026-11-27T08:30:00Z", "endUtc": "2026-11-27T09:30:00Z", "aedt": "7:30 PM - 8:30 PM", "jst": "5:30 PM - 6:30 PM", "ist": "2:00 PM - 3:00 PM", "mins": 60, "format": "Workshop", "speaker": "Dr. Svetlana Meissner", "designation": "AI Trainer", "affiliation": "MDZ Spreeland, Brandenburg University of Technology (BTU)", "title": "Hands-on with AlphaEvolve & Antigravity: Powering Autonomous Agent Pipelines on TPUs", "tracks": ["AI → Science"], "abstract": "Ready to build the next generation of autonomous intelligence? In this hands-on workshop, developers will dive deep into Antigravity and the Gemini Enterprise Agent Platform, integrating them with AlphaEvolve for continuous agent optimization accelerated by Google Cloud TPUs.\nWe will walk through building an end-to-end agentic workflow: setting up Antigravity task pipelines, defining evolutionary discovery loops with AlphaEvolve, and scaling distributed inference workloads. By the end of this session, you will have practical code patterns and deployment strategies to build resilient, self-improving agent systems on Google Cloud.", "bio": "Dr. Svetlana Meissner is a Google Developer Expert in AI/Cloud, entrepreneur, and AI leader at the Spreeland Digital Centre at Brandenburg University of Technology. With a doctorate in physics and a track record spanning the Fraunhofer Institute and neural network research, she specializes in transforming ambitious digital concepts into scalable realities.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.b-tu.de/en/fg-drahtlose-systeme/team/scientific-employees-1/fg-drahtlose-systeme-1", "label": "Website"}, {"url": "https://www.linkedin.com/in/svetlanameissneraitrainer", "label": "LinkedIn"}, {"url": "https://www.digitalzentrum-spreeland.de/Ueber-uns/Ansprechpartner/BTU-Cottbus-Senftenberg/Dr-Svetlana-Meissner.html", "label": "Website"}]}, {"id": "s19", "kind": "session", "day": 1, "block": "Block 1D: Autonomous TPU Pipelines & Reproducible Science", "startUtc": "2026-11-27T09:30:00Z", "endUtc": "2026-11-27T09:50:00Z", "aedt": "8:30 PM - 8:50 PM", "jst": "6:30 PM - 6:50 PM", "ist": "3:00 PM - 3:20 PM", "mins": 20, "format": "Talk", "speaker": "Mr. Krishna Kandi", "designation": "Senior Software Engineer", "affiliation": "Convoke", "title": "From Agent Output to Reproducible Evidence: Provenance-First AI Workflows", "tracks": ["AI → Science", "Science → AI"], "abstract": "AI agents can generate hypotheses, invoke scientific tools, transform datasets, and summarize results, but a useful answer is not automatically reproducible evidence. When models, prompts, tools, or data change, teams may be unable to determine exactly how a result was produced. This session presents a language- and platform-independent architecture for evidence-bound agentic workflows using immutable execution manifests, content-addressed inputs and outputs, versioned tool metadata, recorded model and prompt parameters, explicit verification checkpoints, and replayable workflow graphs. The reference architecture shows how each claim can be traced to the data, tool invocation, and decision path that produced it, while distinguishing deterministic replay from probabilistic re-execution. Attendees will leave with a practical framework for designing AI-assisted research workflows that can be audited, reproduced, and safely evolved.", "bio": "Krishna Kandi is a Software Architect and Senior Software Engineer with 22 years of experience designing and developing distributed, high-availability systems across multiple programming languages and technologies. His work spans financial messaging, telecommunications, enterprise software, secure data processing, and event-driven architecture. His focus is on designing reliable applications that support complex workflows, large-scale data processing, secure communication, and failure recovery. Krishna is also the author of Hacking AI. He writes and speaks about practical software architecture patterns, including reproducibility, traceability, and reliability in tool-using AI systems.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/krishna-kandi-2370269/", "label": "LinkedIn"}]}, {"id": "s20", "kind": "session", "day": 1, "block": "Block 1D: Autonomous TPU Pipelines & Reproducible Science", "startUtc": "2026-11-27T09:50:00Z", "endUtc": "2026-11-27T10:10:00Z", "aedt": "8:50 PM - 9:10 PM", "jst": "6:50 PM - 7:10 PM", "ist": "3:20 PM - 3:40 PM", "mins": 20, "format": "Talk", "speaker": "Dr. Yogita Chitriv (Dubey)", "designation": "Associate Professor", "affiliation": "Yeshwantrao Chavan College of Engineering, Nagpur", "title": "Beyond Classification: Explainable and Efficient Deep Learning for AI-Driven Medical Discovery", "tracks": ["AI → Science"], "abstract": "Artificial Intelligence is transforming scientific research by enabling faster, more accurate, and data-driven discoveries. Medical imaging is one such domain where advanced deep learning architectures are opening new possibilities for disease detection, classification, and clinical decision support.\n\nThis talk explores the application of modern AI architectures, including Convolutional Neural Networks (CNNs), Vision Transformers, hybrid CNN-Transformer models, and ensemble learning approaches for intelligent medical image analysis. It will highlight research applications involving retinal Optical Coherence Tomography (OCT), Alzheimer's disease detection, and liver fibrosis grading.\n\nThe session will discuss how combining complementary deep learning architectures can improve feature representation and classification performance, while Explainable AI (XAI) techniques can help interpret model predictions and improve transparency. It will also address important research challenges, including model generalization, computational efficiency, interpretability, and the potential for deploying AI models in resource-constrained environments.\n\nThrough practical research insights and real-world application scenarios, participants will gain an understanding of how emerging AI techniques can accelerate scientific investigation and contribute to more intelligent healthcare solutions.\n\nThe talk will conclude with future research directions in efficient, explainable, and generalizable AI systems for scientific and clinical applications.", "bio": "Dr. Yogita Chitriv (Dubey) is an Associate Professor in the Department of Electronics and Telecommunication Engineering at Yeshwantrao Chavan College of Engineering (YCCE), Nagpur, India. Her research interests include Artificial Intelligence, Machine Learning, Deep Learning, Computer Vision, Explainable AI, and Edge AI, with a particular focus on AI-driven scientific and healthcare applications.\n\nHer research explores advanced deep learning architectures, hybrid CNN-Transformer models, ensemble learning, and explainable AI techniques for medical image analysis, including retinal OCT classification, Alzheimer's disease detection, and liver fibrosis grading. She is particularly interested in developing efficient, interpretable, and generalizable AI models that can accelerate scientific discovery and support real-world clinical applications.\n\nShe actively contributes to academic research, interdisciplinary collaborations, and international research initiatives. She has published research in peer-reviewed journals and IEEE conferences and serves as a reviewer for international scientific journals and conferences. Through her research, teaching, and mentoring activities, she aims to bridge the gap between emerging AI technologies and practical scientific challenges. She has secured external research funding from CSIR-ASPIRE, AICTE-RPS, DST-FIST, and a collaboration with Harvard University funded by USAID.", "resourceLinks": [], "speakerLinks": [{"url": "https://yogitachitriv.github.io/", "label": "Website"}]}, {"id": "s21", "kind": "session", "day": 1, "block": "Block 1D: Autonomous TPU Pipelines & Reproducible Science", "startUtc": "2026-11-27T10:10:00Z", "endUtc": "2026-11-27T10:20:00Z", "aedt": "9:10 PM - 9:20 PM", "jst": "7:10 PM - 7:20 PM", "ist": "3:40 PM - 3:50 PM", "mins": 10, "format": "Lightning / Demo", "speaker": "Mr. Badal Nyalang", "designation": "Director", "affiliation": "MWire Labs", "title": "Ground Realities of Collecting Language Data in Northeast India", "tracks": ["SciComm & Policy"], "abstract": "Northeast India has over 200 languages, and most have almost no digital data. Without data, speech and language AI cannot serve these communities. This lightning talk is about what it takes to fix that. We share how MWire Labs finds speakers, gets informed consent, records in noisy and low-connectivity settings, and handles dialect variation and missing standard spellings. We cover what went wrong, what quality checks caught, and what we would do differently. The goal is a practical playbook for anyone building datasets for under-resourced languages. Datasets and models are open on Hugging Face where possible.", "bio": "Badal Nyalang is the Founder and Director of MWire Labs, a research and AI deployment lab in Shillong, India. The lab builds foundational language AI for the 220+ indigenous languages of Northeast India, including speech recognition, translation, tokenizers and embeddings. He is an ACM Certified Reviewer and has reviewed for ACM, IEEE Access, ECCV and NeurIPS workshops. He holds an Advanced Certification in Applied Data Science, ML and AI from IIT Guwahati.", "resourceLinks": [], "speakerLinks": [{"url": "https://mwirelabs.com/", "label": "Website"}, {"url": "https://linkedin.com/in/badal-nyalang/", "label": "LinkedIn"}]}, {"kind": "close", "day": 1, "block": "Block 1D: Autonomous TPU Pipelines & Reproducible Science", "startUtc": "2026-11-27T10:20:00Z", "endUtc": "2026-11-27T10:20:00Z", "aedt": "9:20 PM", "jst": "7:20 PM", "ist": "3:50 PM", "mins": 0, "title": "Close of Day 1"}, {"kind": "open", "day": 2, "block": "Block 2A: APAC Kickoff — Research Agency, Clinical Data & Vision", "startUtc": "2026-11-28T02:40:00Z", "endUtc": "2026-11-28T02:40:00Z", "aedt": "1:40 PM", "jst": "11:40 AM", "ist": "8:10 AM", "mins": 0, "title": "Welcome & DevFest Day 2 Kickoff (GDG AI for Science Australia)"}, {"id": "s22", "kind": "session", "day": 2, "block": "Block 2A: APAC Kickoff — Research Agency, Clinical Data & Vision", "startUtc": "2026-11-28T02:40:00Z", "endUtc": "2026-11-28T03:00:00Z", "aedt": "1:40 PM - 2:00 PM", "jst": "11:40 AM - 12:00 PM", "ist": "8:10 AM - 8:30 AM", "mins": 20, "format": "Talk", "speaker": "Dr. Praveena Thevisuthan", "designation": "Lecturer", "affiliation": "Excelsia University College, Australia", "title": "From AI Literacy to Scientific Empowerment: Building Trust and Human Agency in AI-Enabled Research", "tracks": ["SciComm & Policy"], "abstract": "AI is transforming scientific research and opening the door to new knowledge and insights from data, as well as new modes of data communication and research. Generative AI tools can help researchers summarise literature, explore complex information, and communicate scientific results. However, as they become more prevalent, they have also raised concerns about reliability, transparency, research integrity, and human judgment.\n\nThis speak session will examine how AI literacy can help researchers engage with AI technologies critically, confidently, and responsibly. Drawing on the AI literacy skills identified by Long and Magerko (2020) and the general notion of AI literacy put forward by Ng et al. (2021), it explores why technical knowledge alone is not enough for meaningful AI use in scientific research.\n\nThe session builds on research on human – AI collaboration and on suitable reliance on AI systems (Dellermann et al., 2019) and proposes a conceptual framework that unites three aspects–AI literacy, informed trust and researcher agency. It reflects on how these dimensions can enable responsible and ethical AI use, support researchers in assessing AI-generated output, identify its limitations, and maintain control over consequential research decisions.\n\nThrough practical examples from literature synthesis with AI, scientific communication and research evaluation, critical thinking, ethical awareness and human oversight will be highlighted.\n\nThe session ends with a discussion of how universities and research institutions can enhance AI literacy and responsible research practices. Participants will acquire research-driven knowledge of the role of AI literacy, adjusted trust and human agency in responsible human-AI collaboration and scientific discovery.\n\n\nReferences:\n\nNg, D. T. K., Leung, J. K. L., Chu, S. K. W., & Qiao, M. S. (2021). Conceptualizing AI literacy: An exploratory review. Computers and Education: Artificial Intelligence, 2, 100041.https://doi.org/10.1016/j.caeai.2021.100041\n\nDellermann, D., Ebel, P., Söllner, M., & Leimeister, J. M. (2019). Hybrid Intelligence: D. Dellermann et al.: Hybrid Intelligence. Business & information systems engineering, 61(5), 637-643.. https://doi.org/10.1007/s12599-019-00595-2\n\nLong, D., & Magerko, B. (2020). What is AI literacy? Competencies and design considerations. Proceedings of the 2020 CHI Conference on Human Factors in Computing Systems, 1–16. https://doi.org/10.1145/3313831.3376727", "bio": "Dr Praveena Thevisuthan is an experienced University Lecturer and Researcher with over 12 years of professional experience at both the local (Australia) and international levels. She coordinates and teaches multiple courses, including Management, HRM, Organisational Behaviour, Sustainability and Responsible Business Professionalism and related areas. In addition to her teaching responsibilities, she supervises Master’s Degree Research students and has successfully conducted numerous training sessions, seminars, and HDR workshops. She has published her work in Q1 and ABDC-A journals, as well as in book chapters. She was a speaker at All Day AI Global Conference 2026, an international virtual conference with over 12,000 registered participants worldwide, where she delivered a talk titled “From AI Literacy to AI Adoption: Building Employee Trust in Generative AI” She has participated in many prestigious international conferences, including ANZAM, AIRAANZ, and MPDI. Dr Praveena has presented her work as a Speaker at the World Congress on Education (WCE-2026) at Churchill College, Cambridge, UK, where she spoke on advancing AI literacy in higher education. She also has administrative experience at the university level, having served as a student counsellor, coordinator of the career guidance unit, and coordinator of the internal curriculum quality assurance unit. Dr Praveena has received many prestigious awards, including the Best Overall Performance Excellence Academic Award for a Bachelor´s Degree, the University of Newcastle Full PhD Scholarship, and the faculty winner of the Three-Minute Thesis Competition. In addition, she has served as a reviewer for top-tier academic journals (ABDC, A ) and for reputable international conferences (AIB and AOM). She is also a finalist for the 2026 She Inspires Awards- UK 2026 under the Champions of Culture Award Category, and a finalist for five awards- Working Women Awards- UK, 2026.", "resourceLinks": [{"url": "https://doi.org/10.1016/j.caeai.2021.100041", "label": "Website"}, {"url": "https://doi.org/10.1007/s12599-019-00595-2", "label": "Website"}, {"url": "https://doi.org/10.1145/3313831.3376727", "label": "Website"}], "speakerLinks": [{"url": "https://www.linkedin.com/in/praveena-thevisuthan-phd-09213677/", "label": "LinkedIn"}]}, {"id": "s23", "kind": "session", "day": 2, "block": "Block 2A: APAC Kickoff — Research Agency, Clinical Data & Vision", "startUtc": "2026-11-28T03:00:00Z", "endUtc": "2026-11-28T03:20:00Z", "aedt": "2:00 PM - 2:20 PM", "jst": "12:00 PM - 12:20 PM", "ist": "8:30 AM - 8:50 AM", "mins": 20, "format": "Talk", "speaker": "Mr. Yuvaraj (Yuvi) Ghodke", "designation": "Sr Clinical Data Manager", "affiliation": "Australian National University", "title": "Connecting Clinical Trials, Real-World Data and Omics with AI", "tracks": ["AI → Science"], "abstract": "Clinical trials, routine healthcare and omics research reveal complementary aspects of a patient’s health, yet these data often remain disconnected. This session makes the case for interconnected patient data as a foundation for accelerating clinical research with AI.\n\nUsing the example of Pfizer covid-19 vaccine (Comirnaty), the talk will explore how connecting molecular characteristics, treatment experiences and patient outcomes could speed up research outcomes. It will provide an accessible overview of how machine learning, large language models and agentic workflows could help researchers navigate these connections and shorten the path from research question to insight.\n\nThe session will also address the data quality, privacy, traceability and scientific judgement needed to make these approaches trustworthy. Participants will leave with a clearer understanding of the opportunity and practical starting points for AI-enabled research.", "bio": "Yuvi is a clinical research data specialist with over 21 years of experience across industry and academic research. His background includes roles with Oracle, IQVIA, the University of Sydney’s NHMRC Clinical Trials Centre, UNSW Kirby Institute and ANU, with expertise in clinical trials databases designing and research data management. He has supported studies for pharmaceutical customers including Novo Nordisk, Pfizer, Novartis and Eli Lilly.\nHe is proud to be part of Professor Mark Polizzotto's team that designed the first Australian clinical study on COVID-19 in March 2020.\n\nHis AI for Science interests centre on how AI can support (and speed up) clinical research through study protocol interpretation, data quality assessment and the integration of clinical trial, real-world and omics data. He is exploring practical approaches to making research data more interconnected, interpretable and ready for AI, drawing on his experience with the data challenges researchers face.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/yuvarajg/", "label": "LinkedIn"}, {"url": "https://jcsmr.anu.edu.au/research/groups/polizzotto-group-clinical-hub-interventional-research", "label": "Website"}, {"url": "https://www.unsw.edu.au/medicine-health/our-schools/biomedical-sciences/research-and-impact/research-themes/research-groups/pimanda-group-stem-cell-lab", "label": "Website"}, {"url": "https://www.unsw.edu.au/staff/yuvaraj-ghodke", "label": "Website"}]}, {"id": "s24", "kind": "session", "day": 2, "block": "Block 2A: APAC Kickoff — Research Agency, Clinical Data & Vision", "startUtc": "2026-11-28T03:20:00Z", "endUtc": "2026-11-28T03:30:00Z", "aedt": "2:20 PM - 2:30 PM", "jst": "12:20 PM - 12:30 PM", "ist": "8:50 AM - 9:00 AM", "mins": 10, "format": "Lightning / Demo", "speaker": "Mr. Koju Maruyama", "designation": "Founder & CEO", "affiliation": "MARUBO Inc.", "title": "Reading the Trackside: Vision-Language Models for Railway Vegetation Risk from Onboard Video", "tracks": ["AI → Science"], "abstract": "Vegetation growing along railway lines is a constant risk: branches and grass can block signals, touch overhead lines, or fall onto the track. Today, much of this is checked by people walking or riding the line, and the results depend heavily on who is looking.\n\nIn this lightning talk, I will demonstrate a prototype that uses vision-language models to analyse ordinary onboard camera video. For each section of track, it rates vegetation and nearby infrastructure risk on a 5-level scale and explains its reasoning in plain language, linked to the exact video frames it used. When the model is unsure (because of lighting, motion blur or occlusion), it says so and sends the case back to a human inspector rather than guessing.\n\nI will share what worked, what did not (seasonal change, false alarms, and how to keep the model honest), and how we are preparing field validation with a major Japanese railway group company. The aim is not to replace inspectors, but to help them decide where to look first.\n\nInteractive demo: https://marubo.biz/trainvegetation/vegetation_inspection_interactive_en.html", "bio": "Koju Maruyama is the founder and CEO of MARUBO Inc., a Tokyo-based startup building AI that reads field photos, video and technical documents for infrastructure maintenance. His work focuses on \"evidence-grounded\" AI: every finding points back to the exact frame, photo or page it came from, and anything uncertain is returned to a human instead of being guessed. MARUBO provides paid document-checking services for geotechnical reports, and is developing onboard-video analysis for railway vegetation risk with a major Japanese railway group company. He graduated from Cyber University in Japan.", "resourceLinks": [{"url": "https://marubo.biz/trainvegetation/vegetation_inspection_interactive_en.html", "label": "Website"}], "speakerLinks": [{"url": "https://marubo.biz/", "label": "Website"}, {"url": "https://www.linkedin.com/in/marubobiz/", "label": "LinkedIn"}]}, {"id": "s25", "kind": "session", "day": 2, "block": "Block 2B: Trustworthy Agents, Edge AI & Embodied Robotics", "startUtc": "2026-11-28T03:30:00Z", "endUtc": "2026-11-28T03:50:00Z", "aedt": "2:30 PM - 2:50 PM", "jst": "12:30 PM - 12:50 PM", "ist": "9:00 AM - 9:20 AM", "mins": 20, "format": "Talk", "speaker": "Ms. Jyostna Seelam", "designation": "Senior Manager, Engineering Lead", "affiliation": "IEEE Richmond Section and ACM Richmond", "title": "Engineering Trustworthy Agentic AI: Observability, Verification, and Human Oversight for Autonomous Scientific Workflows", "tracks": ["DeepTech & Quantum"], "abstract": "AI agents and large language models are opening new possibilities for scientific discovery, from orchestrating research workflows to interpreting complex datasets and coordinating specialized computational tools. However, autonomous systems introduce important engineering challenges: unreliable outputs, cascading errors, limited observability, excessive tool permissions, and difficulty reproducing or auditing decisions.\n\nThis session explores an engineering-centered framework for building trustworthy agentic AI systems, drawing on principles from enterprise platform engineering, distributed systems, AI observability, security, and reliability engineering. It examines how telemetry, verification gates, bounded tool access, confidence-aware execution, human oversight, and traceable decision records can help make autonomous workflows more dependable.\n\nThrough an illustrative scientific workflow, the session will explain how to monitor agent actions, validate intermediate results, detect failures, recover safely, and preserve accountability throughout execution. Attendees will leave with a practical set of architectural principles for evaluating the reliability and trustworthiness of agentic systems in scientific and other high-consequence applications.\n\nThe talk connects real-world engineering practices with the emerging requirements of autonomous AI, emphasizing that trust must be engineered and continuously evaluated rather than assumed from model performance alone.", "bio": "Jyostna Seelam is an IEEE Senior Member and Senior Manager & Engineering Lead with 19 years of professional engineering experience spanning AI, Agentic AI, trustworthy AI, cloud and distributed systems, site reliability engineering, DevSecOps, observability, and platform engineering. She has architected enterprise platforms supporting more than 15,000 engineers and led automated security remediation initiatives addressing more than two million vulnerabilities.\n\nHer technical research and thought leadership focus on trustworthy autonomous systems, AI-driven observability, intelligent automation, and reliable enterprise AI. She is the author of technical publications and conference research, contributes articles to DevOps.com, DZone, and HackerNoon, and has authored a Springer Nature book chapter, \"Trustworthy AI Systems: Engineering Secure, Scalable, and Responsible Intelligence for Real Applications\".\n\nJyostna has completed more than 100 peer reviews of research papers and contributes to the technical community through scholarly reviewing, conference program committee service, and technology judging. She has presented at IEEE conferences, delivered an invited talk at JFrog swampUP in San Jose, and participated in industry technology panels.\n\nShe is the Founder and Chair of the ACM Richmond Professional Chapter and Co-Founder and Secretary of the IEEE TEMS Richmond Chapter. She is also recognized among ADPList’s Top 10 SRE mentors. Her work bridges enterprise engineering practice and research, with a focus on building AI systems that are observable, verifiable, secure, and reliable in real-world environments.", "resourceLinks": [], "speakerLinks": [{"url": "https://aibuildersnetwork.org/conference/speakers/jyostna-seelam", "label": "Website"}, {"url": "https://jfrog.com/blog/live-panel-recap-women-in-devops/", "label": "Website"}, {"url": "https://www.scrs.in/conference/aic2026/speaker/talk/23199", "label": "Website"}, {"url": "https://devops.com/author/jyostna-seelam", "label": "Website"}]}, {"id": "s26", "kind": "session", "day": 2, "block": "Block 2B: Trustworthy Agents, Edge AI & Embodied Robotics", "startUtc": "2026-11-28T03:50:00Z", "endUtc": "2026-11-28T04:10:00Z", "aedt": "2:50 PM - 3:10 PM", "jst": "12:50 PM - 1:10 PM", "ist": "9:20 AM - 9:40 AM", "mins": 20, "format": "Talk", "speaker": "Dr. Utso Guha Roy", "designation": "Co-Founder & Director", "affiliation": "Udgam AI Pvt Ltd", "title": "From Tissue to Smear: Repurposing a Histopathology Foundation Model for Breast FNA Cytology", "tracks": ["AI → Science"], "abstract": "Foundation models trained on millions of histopathology images are changing how we build diagnostic AI, but almost all of them were trained on tissue sections. Cytology, where cells are smeared rather than cut, is a different visual world. Can a histology model still see what matters?\n\nThis session walks through an end-to-end project that applied Phikon-v2, a frozen self-supervised vision transformer trained on H&E histology, to breast fine-needle aspiration (FNA) cytology. The data covered 7,398 image patches from 312 patients across the five IAC Yokohama categories. Using only free Google Colab and a simple linear classifier on top of frozen features, the model separated high-risk (suspicious and malignant) from lower-risk patches with an AUC of 0.85 on a locked test set of unseen patients. At a threshold fixed in advance, it caught 95.5% of high-risk patches.\n\nThe talk covers the decisions that made the result trustworthy: patient-level splitting to prevent data leakage, native-resolution tiling instead of resizing, freezing every choice before touching the test set, and explainability through tile-level risk maps and occlusion analysis. It is equally candid about what did not work: intermediate categories remained hard, calibration was unstable, and patch-level thresholds did not transfer to patient-level decisions.\n\nKey takeaways for attendees\n\nHow to reuse a pathology foundation model on a new image domain without fine-tuning or paid compute.\nA practical evaluation checklist for medical imaging AI: patient-level splits, a frozen protocol, and patient-clustered confidence intervals.\nWhy a strong ranking score (AUC) and trustworthy probabilities are different things.\nWhere foundation models stop and clinical judgement must take over.", "bio": "Dr Utso Guha Roy is a consultant pathologist with about eight years of diagnostic experience and over 14 years in family medicine. His work sits where clinical pathology meets artificial intelligence, with a focus on computational pathology, generative AI in pathology, and responsible AI governance.\n\nHe is co-founder of the UDGAM AI & Health Research Center, soon to be incubated at Jadavpur University, and AI & Healthcare Lead at GovernAI. He also serves as Chief Medical Officer at Health Vectors, Global Ambassador for Path-IQ, and AI Trainer at UDAYAM AI. He mentors clinician-led AI capstone projects and runs hands-on training that helps doctors learn AI,build and critically evaluate AI tools. He holds ISO/IEC 42001:2023 Lead Auditor certification (BSI), along with CCAIM, ABAIM and a PDCC in Digital Pathology.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/dr-utso-guha-roy-02b25611a", "label": "LinkedIn"}]}, {"id": "s27", "kind": "session", "day": 2, "block": "Block 2B: Trustworthy Agents, Edge AI & Embodied Robotics", "startUtc": "2026-11-28T04:10:00Z", "endUtc": "2026-11-28T04:30:00Z", "aedt": "3:10 PM - 3:30 PM", "jst": "1:10 PM - 1:30 PM", "ist": "9:40 AM - 10:00 AM", "mins": 20, "format": "Talk", "speaker": "Mr. Srinivas Reddy Gudala", "designation": "Staff Engineer, Developer Relations", "affiliation": "Qualcomm India Pvt Ltd", "title": "From Models to Actions: Building Agentic AI at the Edge", "tracks": ["DeepTech & Quantum"], "abstract": "Generative AI has made powerful models increasingly accessible, but the next frontier is moving beyond models that simply generate responses toward intelligent systems that can perceive their environment, reason about it, use tools, make decisions, and take actions in the physical world.\n\nThis session explores how Agentic AI and Edge AI come together to enable autonomous, context-aware systems that operate closer to where data is generated and decisions need to be made. We will examine the journey from running an AI model on-device to building a complete agentic system, covering local inference, multimodal perception, tool use, memory and context, agent orchestration, hardware acceleration, and interaction with sensors and physical systems.\n\nUsing robotics and Physical AI as a practical framing, the session will walk through an architecture where observations from cameras and sensors become context for local AI models, which reason over that information and translate decisions into real-world actions. We will also discuss engineering considerations such as latency, privacy, connectivity, model size, quantization, compute constraints, and efficient CPU/GPU/NPU utilization when taking agents from cloud-centric prototypes to resource-constrained edge platforms.\n\nFinally, we will explore how these patterns can extend to robotics, autonomous scientific instruments, intelligent laboratories, field systems, and other scientific and engineering environments, where bringing AI closer to the physical world can enable a new generation of responsive and autonomous systems.\n\nAttendees will leave with a practical understanding of the architectural building blocks needed to evolve from running models at the edge to building agents that can perceive, reason, and act at the edge.", "bio": "", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/srinivasreddy4u/", "label": "LinkedIn"}]}, {"id": "s28", "kind": "session", "day": 2, "block": "Block 2B: Trustworthy Agents, Edge AI & Embodied Robotics", "startUtc": "2026-11-28T04:30:00Z", "endUtc": "2026-11-28T05:30:00Z", "aedt": "3:30 PM - 4:30 PM", "jst": "1:30 PM - 2:30 PM", "ist": "10:00 AM - 11:00 AM", "mins": 60, "format": "Workshop", "speaker": "Mr. Hyung-Taik Choi", "designation": "Research Engineer", "affiliation": "Hyundai Motor Company", "title": "Grounding Vision-Language Models in the Physical World: Hands-On Pick-and-Place with Gemini Robotics ER 2", "tracks": ["DeepTech & Quantum"], "abstract": "Bridging high-level semantic reasoning and low-level physical control remains a core hurdle in modern robotics. In this interactive technical session, we explore the integration of multimodal foundation models into physical robotic pipelines using the Gemini Robotics ER 2.\n\nAttendees will examine how vision-language models (VLMs) can interpret multi-camera scene context, perform zero-shot spatial bounding and precise 3D keypoint affordance detection, and translate open-vocabulary user directives into real-time manipulation trajectories on a 7-DOF robot  arm.\n\nWe walk through the full architecture of an embodied AI loop: capturing raw scene imagery, invoking the Gemini Robotics ER API for zero-shot object localization, extracting grasping affordances, and bridging predictions to motion planning pipelines via ROS 2 / MoveIt. We will demonstrate live how spatial prompting handles ambiguous tasks, changing lighting conditions, and cluttered environments where traditional rule-based perception fails. Participants will leave with reference implementations, API workflows, and practical design patterns for deploying agentic physical AI systems.\n\nKey Topics Covered:\n- Embodied Spatial Reasoning: Moving beyond standard 2D detection to bounding boxes, semantic centroid points, and grasp orientations directly from natural language prompts.\n- Agentic Task Decomposition: Breaking multi-stage manipulation workflows (\"find the red cubes and stack them into the bin\") into sequence-grounded tool calls.\n- Live Sandbox Integration: Architectural walkthrough of the Google AI Studio Franka Panda pick-and-place interactive demo running on the google-genai SDK.\n- Safety & Execution Boundaries: Managing model latency, API query consensus for high-precision manipulation, and trajectory boundary constraints in physical spaces.", "bio": "I’m Hyung-Taik Choi, a Research Engineer at Hyundai Motor Company working within Hyundai Motor Group's Robotics LAB. My work spans robotics product planning and development, with project experience in smart-factory inspection, customer-facing service robots, autonomous security patrol, and robot–building integration.\n\nWorking on robotics in real environments has shaped my interest in how AI capabilities translate into useful, reliable behavior. I’m particularly interested in embodied AI and human–robot interaction. I’m now looking to deepen that exploration through hands-on experiments with Google’s AI tools and robotics simulation, sharing practical lessons that others can reproduce and build on.", "resourceLinks": [], "speakerLinks": [{"url": "https://linkedin.com/in/htcrefactor", "label": "LinkedIn"}, {"url": "https://github.com/htcrefactor", "label": "GitHub"}]}, {"id": "s29", "kind": "session", "day": 2, "block": "Block 2B: Trustworthy Agents, Edge AI & Embodied Robotics", "startUtc": "2026-11-28T05:30:00Z", "endUtc": "2026-11-28T05:50:00Z", "aedt": "4:30 PM - 4:50 PM", "jst": "2:30 PM - 2:50 PM", "ist": "11:00 AM - 11:20 AM", "mins": 20, "format": "Talk", "speaker": "Dr. Deborsi Basu", "designation": "Experienced Scientific Researcher", "affiliation": "Ericsson Research India", "title": "Profit-Aware Cross-Slice Resource Allocation for Agentic-IoT Embracing Hybrid User Mobility", "tracks": ["DeepTech & Quantum"], "abstract": "Modern 5G and beyond networks require intelligent management of limited radio and computational resources while supporting heterogeneous, autonomous devices. Additionally, the cell-free architecture model for next-generation mobile networks causes rapid handover for mobile UEs (User Entities). This may cause rapid energy depletion in local IoT devices along with the user's handset. Following this concern, this paper presents an end-to-end Software-Defined Networking (SDN) based Agentic control architecture tailored for smart AI-powered IoT (Internet of Things), enabling profit-aware network slicing. An MILP is framed for resource allocation decisions that are jointly optimized across the control plane and the radio access network (RAN). At the radio layer, an LSTM-enhanced Model Predictive Control (MPC) framework addresses temporal instability by predicting UE mobility. At the control layer, a Deep Reinforcement Learning (DRL) agent balances subscription revenue against Physical Resource Block (PRB) and virtual CPU (vCPU) costs. Extensive evaluations demonstrate that prediction-aware MPC improves allocation stability, while DRL-based control significantly increases operational profit.", "bio": "Currently, I am serving as an Experienced Scientific Researcher at Ericsson Research India (Ericsson R&D Bangalore, India) in their 6G Networks Research Team.\nPreviously, I served as a Post-Doctoral Research Scientist at the CONNECT Research Centre, Department of Computer Science and Statistics, of Trinity College Dublin, The University of Dublin, Ireland. \nI completed my PhD at the Communication Networks Lab in the Department of Electronics and Electrical Communication Engineering-IIT Kharagpur, India with the Joint collaboration of G. S. Sanyal School of Telecommunications, Indian Institute of Technology Kharagpur & Dept. of Electrical Engineering and Computer Science, Vanderbilt University, Tennessee, USA. The broad area of my research includes Next Generation Wireless Communication and Network Performance Optimisation. My areas of interest are Intelligent Software Defined Networking (SDN), OpenFlow Protocol Architecture Design, Network Function Virtualization (NFV) of AI-native 5G/6G communication, and beyond, Agentic ORAN Design, Semantic Communication, and related topics.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/deborsi-basu-8364a6103/", "label": "LinkedIn"}]}, {"id": "s30", "kind": "session", "day": 2, "block": "Block 2B: Trustworthy Agents, Edge AI & Embodied Robotics", "startUtc": "2026-11-28T05:50:00Z", "endUtc": "2026-11-28T06:00:00Z", "aedt": "4:50 PM - 5:00 PM", "jst": "2:50 PM - 3:00 PM", "ist": "11:20 AM - 11:30 AM", "mins": 10, "format": "Lightning / Demo", "speaker": "Mr. Trinh Hoang Tu", "designation": "Software Engineer & Undergraduate Researcher", "affiliation": "Grab; HUFLIT", "title": "Beyond Model Accuracy: Evidence-Gated AI for Reliable Industrial Material Inspection", "tracks": ["AI → Science"], "abstract": "Artificial intelligence is transforming industrial material inspection, but a critical challenge remains: can we trust an inspection decision based solely on a computer vision model's prediction?\n\nIn real-world inspection environments, model confidence is only one part of the decision-making process. Missing sensor data, calibration issues, and incomplete traceability can undermine the reliability of automated inspection systems, even when a model appears confident.\n\nIn this session, I will introduce SecureCoating-Vision, an AI-assisted industrial coating inspection prototype developed for the Global AI + Materials Innovation Application Competition 2026 at Tsinghua University, where it received an Excellence Award.\n\nThe system combines YOLO-based image segmentation with an evidence-gated decision architecture. Instead of relying exclusively on model predictions, it considers supporting evidence such as sensor validity, calibration status, and traceability information before producing one of three outcomes: PASS, REJECT, or HOLD.\n\nThrough a practical technical demonstration, I will explain:\n\n- Why model confidence alone is insufficient for reliable inspection decisions.\n- How an evidence-gated architecture can integrate AI predictions with operational safeguards.\n- How fail-closed decision logic can prevent automatic approval when critical evidence is missing.\n- What developers can learn from designing trustworthy AI-assisted inspection workflows.\n\nThe session will focus on system architecture, decision logic, and practical engineering lessons rather than claiming production deployment or experimentally validated industrial performance.\n\nIntended audience: AI engineers, researchers, developers, and practitioners interested in computer vision, trustworthy AI, and scientific or industrial automation.", "bio": "Trinh Hoang Tu is a Software Engineer (Backend, in Training) at Grab and an undergraduate researcher majoring in Cybersecurity at Ho Chi Minh City University of Foreign Languages and Information Technology (HUFLIT), Vietnam.\n\nHis interests include trustworthy AI, computer vision, intelligent systems, and the application of AI to real-world engineering challenges.\n\nHe developed SecureCoating-Vision, an AI-assisted industrial coating inspection prototype that combines computer vision with evidence-based decision logic to support reliable inspection workflows. The project received an Excellence Award at the Global AI + Materials Innovation Application Competition 2026, organized by Tsinghua University's School of Materials Science and Engineering.\n\nHe has also co-authored research accepted at CSoNet 2026 and SOICT 2026. Through his engineering and research activities, he is particularly interested in bridging machine learning prototypes and dependable, practical AI systems.", "resourceLinks": [], "speakerLinks": [{"url": "https://linkedin.com/in/thtcsec", "label": "LinkedIn"}, {"url": "https://hoangtu.dev", "label": "Website"}, {"url": "https://github.com/thtcsec", "label": "GitHub"}]}, {"id": "s31", "kind": "session", "day": 2, "block": "Block 2B: Trustworthy Agents, Edge AI & Embodied Robotics", "startUtc": "2026-11-28T06:00:00Z", "endUtc": "2026-11-28T06:10:00Z", "aedt": "5:00 PM - 5:10 PM", "jst": "3:00 PM - 3:10 PM", "ist": "11:30 AM - 11:40 AM", "mins": 10, "format": "Lightning / Demo", "speaker": "Dr. Tass Paritt", "designation": "CTO", "affiliation": "Inneurva", "title": "Powering Embodied AI with Touch: Crowdsourcing Open Large Tactile Models with Touch4xAi", "tracks": ["DeepTech & Quantum"], "abstract": "While multimodal foundation models excel in vision, speech, and reasoning, Embodied AI and humanoid robotics require a sense of touch to interact safely with the physical world. Traditional tactile hardware remains specialized, fragile, expensive, and impossible to scale for global data collection.\nWe present Touch4xAi, an open-source framework and developer platform that converts commodity smartphone hardware into standardized physical tactile sensors. By capturing microphonic vibroacoustic friction signatures and impact transients during simple sliding and tapping protocols, Touch4xAi extracts intrinsic physical traits, including surface roughness, structural compliance, and mass density, grounded in tribology and contact mechanics physics.\nPowered by Google AI Studio with multi-agent pipeline unifies high-frequency Fast Fourier Transform (FFT) spectroscopy with synchronized IMU kinematics (accelerometer and gyroscope). To overcome hardware gain and velocity variances across heterogeneous mobile devices, measurements are evaluated as unbounded relative differential percentages calibrated against dynamic reference standards, such as human skin or standard textiles.\nThrough our live web-based demo (touch4xai.tass2944.workers.dev) and open GitHub repository (github.com/TassParitt/Touch4xAi), Touch4xAi establishes a scalable crowdsourcing data engine. We invite the global developer and scientific AI community to join this open-science initiative to collect high-density physical tactile datasets, democratize sensor metrology, and train foundational Large Tactile Models (LTMs) for the next generation of physical AI across diverse domains, including material science, clinical healthcare, e-commerce, and robotic manipulation.", "bio": "Dr. Tass Paritt holds a PhD in Surgical Robotics and brings over two decades of R&D expertise in clinical engineering, haptics, and medical device innovation. His work advances Embodied AI beyond visual and auditory perception by embedding a physical sense of touch into intelligent devices using tribology and contact mechanics algorithms. He leads Touch4xAi, an open-source initiative crowdsourcing global tactile datasets to train foundational Large Tactile Models (LTMs) for next-generation robotics, edge metrology, and physical AI applications.", "resourceLinks": [], "speakerLinks": [{"url": "https://touch4xai.tass2944.workers.dev/", "label": "Website"}, {"url": "https://github.com/TassParitt/Touch4xAi", "label": "GitHub"}, {"url": "https://www.linkedin.com/in/tass-paritt-909257233/", "label": "LinkedIn"}]}, {"id": "s32", "kind": "session", "day": 2, "block": "Block 2B: Trustworthy Agents, Edge AI & Embodied Robotics", "startUtc": "2026-11-28T06:10:00Z", "endUtc": "2026-11-28T06:30:00Z", "aedt": "5:10 PM - 5:30 PM", "jst": "3:10 PM - 3:30 PM", "ist": "11:40 AM - 12:00 PM", "mins": 20, "format": "Talk", "speaker": "Prof. Shubham Sunil Patil", "designation": "Assistant Professor", "affiliation": "Warana University, Kolhapur, Maharashtra, India", "title": "AI for Sustainable Science: Advancing Clean Energy and the UN Sustainable Development Goals", "tracks": ["AI → Science", "Science → AI", "SciComm & Policy"], "abstract": "Artificial Intelligence (AI) is emerging as a transformative tool for accelerating scientific discovery and addressing global sustainability challenges. This session explores how AI, machine learning, deep learning, and data-driven scientific approaches can support clean energy development, improve energy efficiency, optimize renewable energy systems, and promote environmental sustainability. The session will highlight AI applications in solar and wind energy forecasting, smart grids, energy storage, electric vehicles, demand-side management, and intelligent energy management systems.\n\nThe session will also examine how AI-driven innovations contribute to the United Nations Sustainable Development Goals (SDGs), particularly **SDG 7: Affordable and Clean Energy, SDG 9: Industry, Innovation and Infrastructure, SDG 11: Sustainable Cities and Communities, SDG 12: Responsible Consumption and Production, and SDG 13: Climate Action**. Through practical examples, emerging research trends, and real-world applications, participants will gain insights into the opportunities and challenges of integrating AI into sustainable scientific research.\n\nThe session aims to encourage interdisciplinary collaboration among researchers, academicians, engineers, and industry professionals to develop innovative, energy-efficient, environmentally responsible, and scalable solutions for a sustainable future. It will also discuss key challenges, including data quality, computational requirements, model interpretability, ethical considerations, and the environmental footprint of AI technologies.", "bio": "I am an academic professional in Electrical Engineering with experience in teaching, research, and industry-academia collaboration. My professional activities include publishing research papers, serving as a reviewer for international conferences and journals, contributing to book chapters, and delivering Faculty Development Programme (FDP) sessions and industry guest lectures.\n\nMy interest in **AI for Science** focuses on exploring the application of artificial intelligence and machine learning to electrical engineering, renewable energy systems, smart grids, energy efficiency, and sustainable technological development. I am keen to promote interdisciplinary research, encourage AI-driven scientific innovation, and collaborate with researchers and academic institutions to address real-world engineering challenges through emerging AI technologies.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/shubham-sunil-patil-54b222127?utm_source=share_via&utm_content=profile&utm_medium=member_android", "label": "LinkedIn"}]}, {"id": "s33", "kind": "session", "day": 2, "block": "Block 2C: GPU Scientific Computing & Life Sciences Models", "startUtc": "2026-11-28T06:30:00Z", "endUtc": "2026-11-28T07:30:00Z", "aedt": "5:30 PM - 6:30 PM", "jst": "3:30 PM - 4:30 PM", "ist": "12:00 PM - 1:00 PM", "mins": 60, "format": "Workshop", "speaker": "Prof. Vinayak Raju Kage", "designation": "Assistant Professor", "affiliation": "Presidency University", "title": "Science for AI: Accelerating Scientific Intelligence with GPU Computing Exploring Physics-Informed Neural Networks, Mathematical Foundations, and Quantum-Inspired AI on GPUs", "tracks": ["Science → AI", "DeepTech & Quantum"], "abstract": "The integration of scientific principles, mathematical foundations, physical laws, and quantum concepts is opening new possibilities for developing intelligent and computationally efficient AI systems. This one-hour hands-on session explores how scientific knowledge can inspire next-generation AI architectures and improve the accuracy, interpretability, and efficiency of machine learning models. The session introduces Physics-Informed Neural Networks (PINNs), which incorporate physical laws and governing equations into neural network training, along with mathematical and quantum-inspired concepts that support emerging AI algorithms. Participants will gain insights into how GPU computing accelerates computationally intensive scientific AI workloads through parallel processing, enabling faster model training, simulation, and experimentation. Using NVIDIA GPU infrastructure, the session will demonstrate the role of GPU acceleration in scientific machine learning and explore practical applications in physics, engineering, and computational research. The workshop aims to bridge the gap between scientific theory and AI implementation, providing participants with a foundational understanding of how GPU-powered scientific intelligence can address complex real-world problems.", "bio": "I am **Vinayak Raju Kage**, currently working as an **Assistant Professor in Computer Science at Presidency University, Bengaluru**, where I am also involved in coordinating the NVIDIA AI Center of Excellence.\n\nI have **7 years of teaching experience and 3 years of industry experience**, combining academic knowledge with practical, industry-oriented expertise. My primary interests lie in Artificial Intelligence, High-Performance Computing (HPC), GPU Computing, Deep Learning, and emerging technologies such as Quantum Computing.\n\nI am particularly passionate about leveraging advanced computing infrastructure, including NVIDIA GPU technologies, to develop scalable AI solutions. My work involves exploring GPU acceleration, CUDA programming, AI model development, and hands-on experimentation with large-scale computing environments.\n\nMy research interests include **AI-driven precision oncology, bioinformatics, computer vision, intelligent surveillance systems, multilingual AI, and AI-powered smart campus solutions**. I am especially interested in integrating High-Performance Computing with multi-omics data analysis to support precision medicine and healthcare research.\n\nBeyond research, I actively contribute to curriculum development, laboratory design, student mentoring, industry collaboration, and hands-on technical training. I believe that education should go beyond theoretical knowledge and empower students to build practical solutions to real-world challenges.\n\nI am also interested in developing interdisciplinary projects that combine AI with renewable energy, agriculture, healthcare, and cybersecurity. My approach is to bridge the gap between academic research and practical implementation by encouraging experimentation, innovation, and industry-relevant learning.\n\nMy long-term vision is to establish myself as a strong researcher in **High-Performance Computing and AI-driven scientific discovery**, contribute to impactful research publications, pursue advanced research in emerging computing paradigms, and build technology solutions that create meaningful societal impact.\n\nI believe that the true value of technology lies not merely in understanding how it works, but in using it to solve meaningful problems and create opportunities for others.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/vinayak-rk-a3388abb", "label": "LinkedIn"}]}, {"id": "s34", "kind": "session", "day": 2, "block": "Block 2C: GPU Scientific Computing & Life Sciences Models", "startUtc": "2026-11-28T07:30:00Z", "endUtc": "2026-11-28T07:50:00Z", "aedt": "6:30 PM - 6:50 PM", "jst": "4:30 PM - 4:50 PM", "ist": "1:00 PM - 1:20 PM", "mins": 20, "format": "Talk", "speaker": "Mr. Shasank Dixit", "designation": "PhD Scholar", "affiliation": "IIT Jodhpur", "title": "LeafSum: Multicast Out, Aggregate Back — Rethinking Communication for Distributed Mixture-of-Experts AI", "tracks": ["DeepTech & Quantum"], "abstract": "As AI models grow larger, faster GPUs alone are no longer sufficient to make distributed training efficient. Communication between accelerators is becoming a critical bottleneck, particularly in Mixture-of-Experts (MoE) architectures, where tokens are dynamically routed to multiple experts distributed across GPUs.\n\nWhat if the network could do more than simply forward packets?\n\nIn this session, I will introduce LeafSum: Multicast Out, Aggregate Back, an ongoing research project investigating how programmable network infrastructure can accelerate distributed MoE training.\n\nConventional expert-parallel systems rely heavily on GPU-to-GPU communication to dispatch token activations and collect expert outputs. LeafSum explores a different approach: multicast token activations toward selected experts and perform hierarchical in-network aggregation of weighted expert outputs on the return path.\n\nThe architecture combines three complementary ideas:\n\n1. Leaf-aware multicast: Reduce redundant data transfers by replicating token activations within the network.\n2. Hierarchical in-network aggregation: Combine eligible expert outputs closer to their computation locations, reducing return-path communication.\n3. Reduction-Domain-Aware (RDA) placement: Place frequently co-activated experts strategically to reduce cross-network traffic.\n\nPreliminary experiments using a 32-node simulated network with 4:1 oversubscription show a 3.07× improvement in modeled communication time for a DeepSeek-V3-inspired workload when computation–communication overlap is considered. A separate flow-level evaluation demonstrates a 47.4% reduction in network-link traffic. These are simulation-based results, not measurements from a deployed GPU cluster.\n\nBeyond performance, I will discuss the practical challenges of realizing this architecture using programmable switches, SmartNICs, and DPUs, including limited switch memory, numerical precision, congestion, and communication correctness.\n\nThe session will connect these ideas to modern AI infrastructure and explain why efficient distributed computing matters for increasingly large AI models used in scientific research.\n\nKey takeaway:  Scaling AI for scientific discovery requires innovations not only in model architectures and accelerators, but also in how data moves and computation is coordinated across distributed systems.\n\nRelated research and technologies: DeepSeek-V3 (2024), DeepEP (2025), DeepSeek Expert Parallelism Load Balancer (EPLB), programmable networking, and network-assisted collective communication.\n\n1) https://arxiv.org/abs/2412.19437\n2) https://github.com/deepseek-ai/DeepEP\n3) https://github.com/deepseek-ai/EPLB", "bio": "Shasank Dixit is a PhD researcher in Computer Science and Engineering at the Indian Institute of Technology (IIT) Jodhpur, India. His research lies at the intersection of **Artificial Intelligence, Computer Networks, and Distributed Computing**, with a focus on AI-driven network optimization and building efficient infrastructure for large-scale AI systems.\n\nHis work explores **Mixture-of-Experts (MoE) training, in-network aggregation, programmable networking, and resource-efficient distributed deep learning**. He has also worked on Graph Neural Networks (GNNs) and reinforcement learning for intelligent 5G network management.\n\nHe is a recipient of the **IndiaAI Fellowship (2026)** and won the **Best Idea Award at India Mobile Congress (IMC) 2026**, recognized among over 1,400 startups and innovators. His research contributions include papers accepted in IEEE Transactions on Network and Service Management and IEEE CCNC 2027.\n\nHe is passionate about advancing AI for Science through scalable, intelligent, and communication-efficient computing systems.", "resourceLinks": [{"url": "https://arxiv.org/abs/2412.19437", "label": "arXiv"}, {"url": "https://github.com/deepseek-ai/DeepEP", "label": "GitHub"}, {"url": "https://github.com/deepseek-ai/EPLB", "label": "GitHub"}], "speakerLinks": [{"url": "https://www.linkedin.com/in/shasank-dixit-250851212", "label": "LinkedIn"}]}, {"id": "s35", "kind": "session", "day": 2, "block": "Block 2C: GPU Scientific Computing & Life Sciences Models", "startUtc": "2026-11-28T07:50:00Z", "endUtc": "2026-11-28T08:00:00Z", "aedt": "6:50 PM - 7:00 PM", "jst": "4:50 PM - 5:00 PM", "ist": "1:20 PM - 1:30 PM", "mins": 10, "format": "Lightning / Demo", "speaker": "Prof. Suthikshn Kumar C.R.", "designation": "Professor", "affiliation": "Defence Institute of Advanced Technology", "title": "Design and Development of LLM-Guru: A Multimodal AI Avatar for Large Language Model Education", "tracks": ["SciComm & Policy"], "abstract": "The technological  advancement of Large Language Models (LLMs) has created a growing need for accessible and engaging educational approaches that help learners understand their underlying concepts, architectures, and practical applications.  This talk  presents LLM-Guru, a multimodal AI avatar designed to support the teaching and learning of LLMs through an interactive and engaging educational experience. The proposed system aims to combine AI-generated explanations with avatar-based presentation to make complex LLM concepts more accessible to learners with different levels of technical expertise. The learning approach focuses on explaining fundamental concepts, illustrating technical principles, and supporting learners in exploring topics related to LLM architectures, prompt engineering, retrieval-augmented generation, fine-tuning, and AI agents. By integrating conversational interaction with multimodal content delivery, LLM-Guru provides an alternative to conventional text-centric learning interfaces. This talk describes the motivation, design objectives, system architecture, and potential applications of the LLM-Guru. It also identifies key challenges associated with educational accuracy, response reliability, learner engagement, and the evaluation of AI-assisted learning. LLM-Guru offers a foundation for exploring avatar-based AI education and highlights opportunities for developing more interactive and accessible approaches to learning emerging AI technologies. Future work will evaluate the system's instructional effectiveness, technical reliability, usability, and impact on learner understanding.\n\nWeblink: https://llm-guru-ai-avatar-llm-instructor.ai.studio/", "bio": "Dr. CRS Kumar is currently Professor in the Department of Computer Science and Engineering (DIAT), DRDO, Ministry of Defence, GOI. His areas of interest are in AI, Cyber Security, Virtual Reality/Augmented Reality and Game Theory. He is a Fellow of IETE, Fellow of Institution of Engineers, Fellow of BCS, Senior Member of IEEE,  Chartered Engineer(Institution of Engineers), Distinguished Visitor Program(DVP) Speaker of IEEE Computer Society, Lean Six Sigma Green Belt, Certified Independent Director( Ministry of Corporate Affairs/IICA Databank).  He has also earned PhD, MTech, MBA, BE, PGP Certificates from  University of Melbourne, IITM, Bangalore University, Rutgers University, Massachusetts Institute of Technology(MIT) ,  University of Texas at Austin and Stanford Univerisity. Prof Kumar is top 1% ranked in Global Machine Learning coding competitions. He has supervised number of sponsored and student projects in AI and ML.", "resourceLinks": [{"url": "https://llm-guru-ai-avatar-llm-instructor.ai.studio/", "label": "Website"}], "speakerLinks": [{"url": "https://www.linkedin.com/in/cr-suthikshn-kumar-a56544170/", "label": "LinkedIn"}]}, {"id": "s36", "kind": "session", "day": 2, "block": "Block 2C: GPU Scientific Computing & Life Sciences Models", "startUtc": "2026-11-28T08:00:00Z", "endUtc": "2026-11-28T09:00:00Z", "aedt": "7:00 PM - 8:00 PM", "jst": "5:00 PM - 6:00 PM", "ist": "1:30 PM - 2:30 PM", "mins": 60, "format": "Workshop", "speaker": "Prof. Sara El-Ateif", "designation": "Assistant Professor", "affiliation": "ENSIASD, Ibn Zohr University", "title": "AI for Health & Life Sciences", "tracks": ["AI → Science"], "abstract": "Artificial Intelligence is rapidly accelerating discovery in the health and life sciences, moving from general-purpose models to highly specialized tools. This session provides a concise introduction to Google's family of open-weight models specifically adapted for the complexities of medicine and biology. We will explore the capabilities of models such as MedGemma, a collection of variants trained for advanced medical text and image comprehension, and TxGemma, which is designed to accelerate therapeutic development. Beyond the theory, the second half of this workshop will serve as a practical, quick-start guide. Given that these are open-weight models, we will demonstrate how to access, load, and begin experimenting with them within Google's ecosystem, including practical workflows in Vertex AI Model Garden, Kaggle, and Google Colab. Attendees will leave with a clear understanding of what these models are and the first steps needed to leverage them for their own research and development.", "bio": "Dr. Sara El-Ateif is a Maître de Conférences in AI and Big Data at ENSIASD, Ibn Zohr University (Agadir, Morocco). She holds a PhD in Computer Science with a specialisation in multimodal deep learning, bridging theoretical AI and real-world applications. As a Google Developer Expert (GDE) in AI and a certified NVIDIA Deep Learning Institute (DLI) Instructor, she is deeply invested in advancing the field through both research and education, currently coordinating and mentoring over 120 engineering students.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/sara-el-ateif", "label": "LinkedIn"}]}, {"id": "s37", "kind": "session", "day": 2, "block": "Block 2D: Healthcare Innovation, Bioacoustics & Responsible AI", "startUtc": "2026-11-28T09:00:00Z", "endUtc": "2026-11-28T09:20:00Z", "aedt": "8:00 PM - 8:20 PM", "jst": "6:00 PM - 6:20 PM", "ist": "2:30 PM - 2:50 PM", "mins": 20, "format": "Talk", "speaker": "Dr. Ameet Vaman Revankar", "designation": "Professor of Orthodontics", "affiliation": "SDM College of Dental Sciences, SDM University, Dharwad", "title": "Assistive diagnostics using Antigravity: Building an agentic orthodontic copilot via the model context protocol", "tracks": ["AI → Science"], "abstract": "Contemporary diagnostics involves examining of 3D data, interaction and manipulation of 3d rendering/computing software and conversion of the information gleaned by these processes into actionable decisions which include but are not limited to biomechanical plans.\nIn this lecture I present an end to end workflow in Google antigravity demonstrating how the  IDE coordinates diagnostic/research assistance complementing and enhancing human clinical acumen.\nWhat this session covers:\n1.        Antigravity as an Orchestration Hub: How Google Antigravity manages multi-step pipelines across editor, terminal, and MCP tools in the context of 3D data analytics.\n2.        Connecting Scientific Tools via MCP: Interfacing Antigravity with specialized medical software (3D Slicer via mcp-slicer via python tooling ) to enable 3D data segmentation, superimposition, simplistic 2d representation etc for research as well as patient/trainee education.\n3.        Human-in-the-Loop Co-Pilot: Structuring agents strictly as interactive code writers/interpreters. I showcase how Antigravity’s verifiable artifacts (task plans, walkthroughs, visual diffs) give full interpretability, auditability, and safety oversight before any diagnostic conclusion is arrived at by the clinician \nAttendees will gain a blueprint for using Google Antigravity via Model Context Protocol to build, privacy-compliant agentic workflows in computational medicine and life sciences.\n\nBrief snippets of this work can be found on my Linkedin posts -www.linkedin.com/in/ameet-vaman-phd-314bbb94", "bio": "Dr. Ameet Vaman Revankar B.D.S,  M.D.S \nis a Professor of Orthodontics and Dentofacial Orthopaedics at the SDM College of Dental Sciences, Dharwad. A distinguished academician with over 60 publications in top ranking journals he serves on the editorial board of BMC Oral Health (Springer Nature), Deep science publishing and Rajiv Gandhi university of health sciences dental journal (Govt of Karnataka) and has previously served as Executive Editor for the Journal of the Asia Pacific Orthodontic Society.\nDr. Revankar has lectured on international platforms including World Federation of Orthodontists London, Taiwan, Indonesia, and Cambodia. Bridging the gap between traditional dentistry and future technology, he is currently pioneering research with a PhD focused on Artificial Intelligence applications in Orthodontics.\nRecognized as the 'Best Senior Academician in Orthodontics' (2017 Guident Awards), and conferred the Clinical excellence in orthodontics, national award 2026 by the Indian Dental Association. He lectures extensively on AI in dentistry with more than 15 lectures in 2026 alone .  Notably, he conducted highly impactful full day AI hands-on courses at the various platforms such as the IOS PG Convention Delhi ,   South west Maharashtra, Madhya Pradesh orthodontic study group, Maratha Mandal dental college Belgaum , AME dental college Raichur, Vishnu dental college , Bheemavaram, AJ institute of dental Sciences, Mangalore , IDA DK branch . Dr Revankar has also lectured at the recently concluded IEEE (Bangalore)Medtech Conclave 2026 and presented his work on agentic AI in dentistry to an elite engineering audience. Dr. Revankar continues to push the boundaries of the profession, combining clinical excellence with the power of modern innovation. He has completed certification in healthcare AI from International  Institute of Information technology Hyderabad .", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/ameet-vaman-phd-314bbb94", "label": "LinkedIn"}]}, {"id": "s38", "kind": "session", "day": 2, "block": "Block 2D: Healthcare Innovation, Bioacoustics & Responsible AI", "startUtc": "2026-11-28T09:20:00Z", "endUtc": "2026-11-28T09:40:00Z", "aedt": "8:20 PM - 8:40 PM", "jst": "6:20 PM - 6:40 PM", "ist": "2:50 PM - 3:10 PM", "mins": 20, "format": "Talk", "speaker": "Ms. Sara El Hour", "designation": "MD candidate | Health Tech Entrepreneur", "affiliation": "Urgentis", "title": "AI Beyond Diagnosis: Transforming Prevention, Patient Education and the Continuum of Care", "tracks": ["DeepTech & Quantum"], "abstract": "Artificial intelligence is increasingly transforming medicine through advances in diagnosis, medical imaging and clinical decision support. However, its potential in healthcare goes far beyond identifying diseases or assisting physicians in clinical decisions. AI can also address important gaps throughout the patient journey, from prevention and early awareness to emergency care, disease understanding and long-term patient support.\n\nThis session explores how AI can contribute to several complementary areas of healthcare:\n\n- Prevention and early risk awareness: using AI to identify health risk patterns, support early awareness and encourage preventive approaches, particularly for chronic diseases such as diabetes and hypertension.\n- Emergency care and healthcare orientation: developing AI-powered tools that help individuals better understand their symptoms, recognize situations requiring urgent attention, access appropriate first-aid information and navigate healthcare services.\n- Health literacy and disease education: making reliable medical information more accessible and understandable, helping patients learn about diseases, their risk factors, symptoms, complications and available treatment options.\n- Therapeutic patient education and chronic disease management:supporting patients in understanding and managing conditions such as diabetes, while helping healthcare professionals provide more personalized information and guidance.\n- Healthcare professional training: exploring AI-powered simulations that allow healthcare professionals to develop communication skills and better address patients' concerns, beliefs and difficulties with treatment.\n\nThese applications illustrate how AI can support not only healthcare professionals, but also patients and individuals before, during and after a medical encounter.\n\nThe session will also examine the challenges that must accompany this development, including medical reliability, patient safety, data privacy, accessibility, linguistic and cultural adaptation, and the need for appropriate human oversight.\n\nUltimately, the goal is to explore a broader vision of AI in healthcare: moving beyond diagnosis to strengthen prevention, improve access to medical information, support timely healthcare orientation and empower patients throughout their care journey.", "bio": "Sara El Hour is a MD candidate, AI developer, and health-tech entrepreneur based in Morocco, passionate about exploring the intersection of artificial intelligence, medicine, and scientific innovation.\n\nShe is the Co-founder of Urgentis, a health-tech startup exploring AI-driven solutions for emergency care, healthcare orientation, and access to health information. Her work extends to several areas of AI in healthcare, including preventive medicine, chronic disease risk assessment, machine learning for medical research, and AI-powered educational technologies.\n\nThrough projects involving digital health applications, data-driven approaches to disease prevention, and adaptive simulations for medical communication training, she explores how AI can address practical challenges across healthcare, research, and medical education.\n\nBeyond her project development activities, she is interested in the responsible application of AI, human-centered technology design, and scientific entrepreneurship, with a particular focus on developing solutions adapted to the realities and needs of emerging healthcare ecosystems.\n\nHer ambition is to help bridge the gap between medical knowledge, scientific research, and technological innovation.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/el-hour-sara-2794941a6?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=ios_app", "label": "LinkedIn"}]}, {"id": "s39", "kind": "session", "day": 2, "block": "Block 2D: Healthcare Innovation, Bioacoustics & Responsible AI", "startUtc": "2026-11-28T09:40:00Z", "endUtc": "2026-11-28T10:00:00Z", "aedt": "8:40 PM - 9:00 PM", "jst": "6:40 PM - 7:00 PM", "ist": "3:10 PM - 3:30 PM", "mins": 20, "format": "Talk", "speaker": "Mr. Samuel Babalola", "designation": "AI/ML Researcher, Lead, Robust & Adaptive Systems Pod", "affiliation": "Ruzivo Research Lab, African Leadership University", "title": "Listening to the Soil: What Can Bioacoustics and Deep Learning Tell Us About Underground Life?", "tracks": ["AI → Science"], "abstract": "Soil holds a large share of Earth’s biodiversity, yet studying soil fauna/organisms still depends on destructive sampling that captures only momentary snapshots, while existing agricultural sensing focuses almost entirely on abiotic factors like moisture and temperature. This talk presents research on non-invasive, continuous monitoring of soil fauna activity using passive bioacoustics, an approach that listens to the soil rather than digging it up. As soil organisms move, they produce subtle vibrations that can be captured with a piezoelectric contact sensor, recorded alongside soil moisture, temperature, and humidity to provide environmental context for the biological signal. Deep learning models then classify the level of biological activity from these recordings in real time.\n\nA persistent challenge in applying machine learning to real-world science is the scarcity of labelled data, and it is especially acute in domains like soil bioacoustics, where expert annotation of underground audio is rare and costly. The soil-acoustic recordings available for this work came without activity labels. To address this, the research introduces a dual-labelling pipeline that combines acoustic-index thresholding with unsupervised clustering, then trains a resolver model on the cases where both methods agree to label the remaining data. Five pretrained CNNs were compared on Mel-spectrograms, with a fine-tuned InceptionV3 classifying high versus low activity at 96% accuracy.\n\nThe talk closes by reflecting on limitations and open questions for the field, including validating acoustic proxy labels against biological ground truth, transferring models across sensors and soils, and understanding how environmental conditions drive soil fauna activity. This work received a Top Poster Award at Research in Africa Days, Deep Learning Indaba 2026, and was presented at ICICT 2026 (Springer).\n\nReferences and resources:\n\n1) Paper: Babalola, S., Ogore, M., Nsabiyumva, S. (2027). An AI Powered IoT System for Real-Time, Non-invasive Monitoring of Soil Biodiversity Using Bioacoustics. In: Proceedings of the 11th International Congress on Information and Communication Technology (ICICT 2026). Lecture Notes in Networks and Systems, vol 2118. Springer,
