<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APAC AI for Science DevFest 2026 — Speaker Program & Abstracts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Light Google Material 3 Color Palette */
      --bg-page: #F8F9FA;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F1F3F4;
      --border-light: #DADCE0;
      --border-subtle: #E8EAED;

      --text-primary: #202124;
      --text-secondary: #5F6368;
      --text-muted: #70757A;

      --google-blue: #1A73E8;
      --google-blue-hover: #1557B0;
      --google-blue-tint: #E8F0FE;
      --google-blue-text: #174EA6;

      --google-green: #1E8E3E;
      --google-green-tint: #E6F4EA;
      --google-green-text: #137333;

      --google-yellow: #F9AB00;
      --google-yellow-tint: #FEF7E0;
      --google-yellow-text: #B06000;

      --google-red: #D93025;
      --google-red-tint: #FCE8E6;
      --google-red-text: #C5221F;

      --teal-tint: #E4F7FB;
      --teal-text: #007B83;

      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-pill: 999px;
      --shadow-sm: 0 1px 2px rgba(60, 64, 67, 0.08), 0 1px 3px 1px rgba(60, 64, 67, 0.04);
      --shadow-hover: 0 2px 6px rgba(60, 64, 67, 0.12), 0 1px 2px rgba(60, 64, 67, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 48px;
    }

    /* Top Google 4-Color Accent Bar */
    .google-accent-bar {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg,
          #4285F4 0%, #4285F4 25%,
          #EA4335 25%, #EA4335 50%,
          #FBBC04 50%, #FBBC04 75%,
          #34A853 75%, #34A853 100%);
    }

    .container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    .site-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 28px 0 22px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--google-blue);
      background: var(--google-blue-tint);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 12px;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    h1 {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size: clamp(22px, 3.2vw, 30px);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14.5px;
      color: var(--text-secondary);
      max-width: 700px;
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      padding: 5px 11px;
      border-radius: var(--radius-sm);
      font-weight: 500;
    }

    /* Controls Toolbar */
    .controls-wrapper {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 14px 0;
    }

    .controls-row-main {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 9px 34px 9px 38px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--bg-page);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      transition: border-color 0.15s, background-color 0.15s, box-shadow 0.15s;
    }

    .search-input:focus {
      outline: none;
      background: var(--bg-surface);
      border-color: var(--google-blue);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.14);
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 4px;
      display: none;
    }

    .clear-search.visible {
      display: block;
    }

    .tz-select-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tz-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .select-control {
      padding: 8.5px 10px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .select-control:focus {
      outline: none;
      border-color: var(--google-blue);
    }

    /* Filter Chips Row */
    .controls-row-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .day-tabs {
      display: inline-flex;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: var(--radius-sm);
    }

    .day-tab {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .day-tab.active {
      background: var(--bg-surface);
      color: var(--google-blue);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .chip {
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .chip:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    .chip.active {
      background: var(--google-blue-tint);
      border-color: #AECBFA;
      color: var(--google-blue-text);
      font-weight: 600;
    }

    .chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Status & Utility Bar */
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 18px 0 14px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .utility-btns {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-text {
      background: none;
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-text:hover {
      color: var(--google-blue);
      border-color: var(--google-blue);
      background: var(--google-blue-tint);
    }

    /* Day & Block Headers */
    .day-section {
      margin-top: 24px;
    }

    .day-banner {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 2px solid var(--text-primary);
    }

    .day-banner h2 {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .day-banner span {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .block-header {
      margin: 20px 0 10px;
      padding: 7px 12px;
      background: var(--bg-subtle);
      border-left: 3px solid var(--google-blue);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    /* Break / Marker Row */
    .marker-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 14px;
      margin: 8px 0;
      font-size: 12.5px;
      color: var(--text-muted);
      border: 1px dashed var(--border-light);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.55);
    }

    .marker-time {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      min-width: 145px;
      color: var(--text-secondary);
    }

    /* Session Card */
    .session-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .session-card:hover {
      box-shadow: var(--shadow-hover);
      border-color: var(--border-light);
    }

    .session-card.bookmarked {
      border-left: 4px solid var(--google-yellow);
    }

    .card-grid {
      display: grid;
      grid-template-columns: 165px 1fr;
      gap: 18px;
      align-items: start;
    }

    /* Left Time Column */
    .time-col {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-top: 2px;
    }

    .time-primary {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }

    .time-date-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .format-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin-top: 4px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 2.5px 8.5px;
      border-radius: 4px;
    }

    .fmt-talk {
      background: var(--google-blue-tint);
      color: var(--google-blue-text);
    }

    .fmt-workshop {
      background: var(--google-green-tint);
      color: var(--google-green-text);
    }

    .fmt-lightning {
      background: var(--google-yellow-tint);
      color: var(--google-yellow-text);
    }

    .fmt-custom {
      background: var(--google-red-tint);
      color: var(--google-red-text);
    }

    /* Right Content Column */
    .content-col {
      min-width: 0;
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .session-title {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
      cursor: pointer;
    }

    .session-title:hover {
      color: var(--google-blue);
    }

    .bookmark-btn {
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 6px;
      flex-shrink: 0;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .bookmark-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    .bookmark-btn.active {
      color: var(--google-yellow);
    }

    .speaker-line {
      margin-top: 5px;
      font-size: 13.5px;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .speaker-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .speaker-aff {
      color: var(--text-secondary);
    }

    .track-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .track-tag {
      font-size: 11.5px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-page);
      color: var(--text-secondary);
    }

    .track-tag[data-track="AI → Science"] {
      background: #F0F6FF;
      border-color: #D2E3FC;
      color: #174EA6;
    }

    .track-tag[data-track="Science → AI"] {
      background: #EEFBF3;
      border-color: #CEEAD6;
      color: #137333;
    }

    .track-tag[data-track="DeepTech & Quantum"] {
      background: #FFF9EB;
      border-color: #FDE293;
      color: #A85500;
    }

    .track-tag[data-track="SciComm & Policy"] {
      background: #FEF1F0;
      border-color: #FAD2CF;
      color: #B3261E;
    }

    .track-tag[data-track="Responsible AI"] {
      background: var(--teal-tint);
      border-color: #B2EBF2;
      color: var(--teal-text);
    }

    /* Abstract Preview & Full Body */
    .abstract-wrap {
      margin-top: 11px;
      font-size: 14px;
      color: #3C4043;
      line-height: 1.62;
    }

    .abstract-preview {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .session-card.expanded .abstract-preview {
      display: none;
    }

    .details-panel {
      display: none;
    }

    .session-card.expanded .details-panel {
      display: block;
    }

    .abstract-full p {
      margin-bottom: 10px;
    }

    .abstract-full p:last-child {
      margin-bottom: 0;
    }

    .abstract-full ul {
      margin: 6px 0 10px 20px;
    }

    .abstract-full li {
      margin-bottom: 4px;
    }

    /* Speaker Bio & Links inside Expanded Panel */
    .bio-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .bio-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .links-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .ext-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: var(--google-blue);
      background: var(--google-blue-tint);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: background 0.15s;
    }

    .ext-link:hover {
      background: #D2E3FC;
      text-decoration: none;
    }

    .card-footer-actions {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-btn {
      background: none;
      border: none;
      color: var(--google-blue);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .toggle-btn:hover {
      color: var(--google-blue-hover);
      text-decoration: underline;
    }

    mark {
      background-color: #FEF08A;
      color: inherit;
      padding: 0 2px;
      border-radius: 2px;
    }

    /* Empty State */
    .empty-state {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 44px 20px;
      text-align: center;
      margin-top: 20px;
    }

    .empty-state h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    /* Responsive adjustments for embeds & mobile */
    @media (max-width: 740px) {
      .controls-row-main {
        grid-template-columns: 1fr;
      }

      .tz-select-wrap {
        justify-content: space-between;
      }

      .select-control {
        flex: 1;
      }

      .card-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .time-col {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .format-badge {
        margin-top: 0;
      }

      .marker-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
    }
  </style>
</head>

<body>
  <div class="google-accent-bar"></div>

  <section class="controls-wrapper" aria-label="Program search and filters">
    <div class="container">
      <div class="controls-row-main">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input"
            placeholder="Search by topic, method (e.g. PINN, RAG, molecular dynamics, VLM), speaker, or institution..."
            autocomplete="off" />
          <button id="clearSearchBtn" class="clear-search" title="Clear search"
            aria-label="Clear search">&times;</button>
        </div>

        <div class="tz-select-wrap">
          <label for="formatSelect" class="tz-label">Format:</label>
          <select id="formatSelect" class="select-control">
            <option value="ALL">All Formats (43)</option>
            <option value="Talk">Talks — 20m (30)</option>
            <option value="Workshop">Workshops — 60m (5)</option>
            <option value="Lightning / Demo">Lightning &amp; Demos — 10m (8)</option>
          </select>
        </div>

        <div class="tz-select-wrap">
          <label for="tzSelect" class="tz-label">Timezone:</label>
          <select id="tzSelect" class="select-control">
            <option value="LOCAL">My Local Time</option>
            <option value="Australia/Sydney">AEDT — Sydney (UTC+11)</option>
            <option value="Asia/Tokyo">JST / KST — Tokyo &amp; Seoul (UTC+9)</option>
            <option value="Australia/Perth">AWST / SGT — Perth &amp; Singapore (UTC+8)</option>
            <option value="Asia/Kolkata">IST — India (UTC+5:30)</option>
            <option value="Europe/Berlin">CET — Berlin &amp; Paris (UTC+1)</option>
            <option value="UTC">UTC</option>
            <option value="America/New_York">EST — US East (UTC-5)</option>
            <option value="America/Los_Angeles">PST — US West (UTC-8)</option>
          </select>
        </div>
      </div>

      <div class="controls-row-filters">
        <div class="chip-group" role="tablist" aria-label="Day filter">
          <div class="day-tabs">
            <button class="day-tab active" data-day="ALL">All Days</button>
            <button class="day-tab" data-day="1">Day 1 · Fri 27 Nov</button>
            <button class="day-tab" data-day="2">Day 2 · Sat 28 Nov</button>
          </div>
          <button class="chip" id="savedFilterBtn" title="Show your saved sessions">
            <span>★ Saved</span>
            <span id="savedCountBadge">(0)</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <main class="container">
    <div class="status-bar">
      <div id="resultsSummary">Showing all <strong>43</strong> sessions</div>
      <div class="utility-btns">
        <button class="btn-text" id="expandAllBtn">Expand all abstracts</button>
        <button class="btn-text" id="resetFiltersBtn" style="display:none">Reset filters</button>
      </div>
    </div>

    <div id="programContainer"></div>
  </main>

  <script>
    const PROGRAM_ITEMS = [{"kind": "open", "day": 1, "block": "Block 1A: Clinical AI, Agentic Discovery & Public Data", "startUtc": "2026-11-27T01:00:00Z", "endUtc": "2026-11-27T01:00:00Z", "aedt": "12:00 PM", "jst": "10:00 AM", "ist": "6:30 AM", "mins": 0, "title": "Welcome & DevFest Day 1 Kickoff (GDG AI for Science Australia)"}, {"id": "s01", "kind": "session", "day": 1, "block": "Block 1A: Clinical AI, Agentic Discovery & Public Data", "startUtc": "2026-11-27T01:00:00Z", "endUtc": "2026-11-27T01:20:00Z", "aedt": "12:00 PM - 12:20 PM", "jst": "10:00 AM - 10:20 AM", "ist": "6:30 AM - 6:50 AM", "mins": 20, "format": "Talk", "speaker": "Nevasini Sasikumar", "designation": "Machine learning researcher", "affiliation": "Independent ML Researcher", "title": "Evaluating transfer learning for clinical NER across languages", "tracks": ["AI → Science"], "abstract": "How should we evaluate an NLP model when labeled data is scarce and language changes the input? I'll discuss our ClinicalNLP 2023 paper, Transfer Learning for Low-Resource Clinical Named Entity Recognition, and its reported experiments on Spanish, French and conversational clinical text. The presentation explains the published transfer-learning workflow and the evidence behind the reported F1 comparisons.\n\nWe'll introduce entity-span labeling with clearly marked teaching examples, then examine what an entity match means, how translation affects annotation alignment, and which training and test conditions need to stay comparable. Attendees will leave with questions they can use to interpret low-resource NLP results and plan follow-up checks. This is a discussion of published research with teaching examples; it does not present a clinical deployment or a new replication.\n\nPaper: https://aclanthology.org/2023.clinicalnlp-1.53/", "bio": "Nevasini Sasikumar holds an M.S. in Data Science from UC San Diego. Her research interests include NLP, computer vision and AI evaluation. She is first author of the ClinicalNLP 2023 paper Transfer Learning for Low-Resource Clinical Named Entity Recognition and served as a judge at TreeHacks 2026. Her proposed session discusses the published research and the evidence needed to interpret low-resource NLP results.", "resourceLinks": [{"url": "https://aclanthology.org/2023.clinicalnlp-1.53/", "label": "Website"}], "speakerLinks": [{"url": "https://www.linkedin.com/in/nevasini-sasikumar/", "label": "LinkedIn"}, {"url": "https://github.com/nevasini", "label": "GitHub"}]}, {"id": "s02", "kind": "session", "day": 1, "block": "Block 1A: Clinical AI, Agentic Discovery & Public Data", "startUtc": "2026-11-27T01:20:00Z", "endUtc": "2026-11-27T02:20:00Z", "aedt": "12:20 PM - 1:20 PM", "jst": "10:20 AM - 11:20 AM", "ist": "6:50 AM - 7:50 AM", "mins": 60, "format": "Workshop", "speaker": "Mr. Hastimal Jangid", "designation": "Co-Founder and CEO / CTO", "affiliation": "RankRabbit AI", "title": "Beyond RAG: Building Evidence-Grounded Healthcare AI Agents with Gemini & Google ADK", "tracks": ["AI → Science", "Science → AI", "DeepTech & Quantum", "SciComm & Policy"], "abstract": "Scientific information is growing faster than researchers, developers, and healthcare professionals can manually explore it. While large language models can generate fluent answers, scientific applications require something more important: traceable evidence, reliable data retrieval, and transparent reasoning workflows.\n\nHow can we move beyond traditional Retrieval-Augmented Generation (RAG) toward AI agents that retrieve scientific information, coordinate tools, and produce responses grounded in verifiable sources?\n\nIn this technical session, I will demonstrate an open-source healthcare discovery platform built using Google's Gemini, Agent Development Kit (ADK), and publicly available healthcare and biomedical information sources.\n\nThrough a practical scenario—a parent searching for pediatric dentists for an anxious child—we will examine how an agentic workflow interprets a complex question, generates targeted retrieval tasks, queries healthcare provider information from NPPES and biomedical literature from PubMed, and organizes findings into an evidence-supported response.\n\nWe will explore the architecture behind multi-step retrieval, tool orchestration, query decomposition, source attribution, and handling incomplete or conflicting information.\n\nImportantly, we will discuss the distinction between retrieving scientific evidence and validating a scientific claim, including hallucination risks, limitations of public datasets, and the need for human evaluation.\n\nThe session will include a live demonstration, an architecture walkthrough, and practical engineering lessons from developing the open-source platform.\n\n**Attendees will learn:**\n- How agentic retrieval differs from traditional RAG.\n- How to orchestrate evidence retrieval using Gemini and Google ADK.\n- How to integrate public biomedical and healthcare datasets.\n- How to design traceable, source-grounded AI outputs.\n- How to evaluate limitations and reliability in scientific AI workflows.\n- How to build reproducible, open-source AI for Science applications.\n\nThis session connects scientific information access with practical agentic AI engineering, helping developers and researchers build systems that are more transparent, reproducible, and evidence-aware.\n\nGitHub: https://github.com/hastimal/gemini-healthcare-agentic-platform", "bio": "Hastimal Jangid is a Cloud and AI Architect, IEEE Senior Member, AWS Golden Jacket recipient, technical speaker, open-source contributor, and Co-founder of RankRabbit AI, specializing in production-grade Agentic AI and cloud-native technologies.\n\nHe holds **12× Google Cloud certifications, 28+ Google Cloud Skills Boost badges, and 60+ professional and technical certifications** across Google Cloud, AWS, Microsoft Azure, Kubernetes, AI, and other emerging technologies.\n\nHis technical expertise includes Gemini, Google Agent Development Kit (ADK), Google Cloud, Retrieval-Augmented Generation (RAG), multi-agent systems, evidence-grounded AI, and cloud-native AI infrastructure.\n\nHe has delivered technical talks and hands-on workshops for Google Developer Groups and universities, covering Gemini-powered AI search, private AI agents using Gemma and Ollama, and production-grade AI applications. His contributions also include a healthcare AI research poster on evidence-grounded healthcare discovery using Google technologies.\n\nThrough open-source projects, technical publications, and community education, he focuses on making advanced AI technologies practical, reproducible, and accessible to developers and researchers.\n\n**GitHub:** https://github.com/hastimal\n\n**LinkedIn:** https://www.linkedin.com/in/hastimaljangid/", "resourceLinks": [{"url": "https://github.com/hastimal/gemini-healthcare-agentic-platform", "label": "GitHub"}], "speakerLinks": [{"url": "https://hastimal.github.io", "label": "Website"}, {"url": "https://github.com/hastimal", "label": "GitHub"}, {"url": "https://www.linkedin.com/in/hastimaljangid/", "label": "LinkedIn"}]}, {"id": "s03", "kind": "session", "day": 1, "block": "Block 1A: Clinical AI, Agentic Discovery & Public Data", "startUtc": "2026-11-27T02:20:00Z", "endUtc": "2026-11-27T02:40:00Z", "aedt": "1:20 PM - 1:40 PM", "jst": "11:20 AM - 11:40 AM", "ist": "7:50 AM - 8:10 AM", "mins": 20, "format": "Talk", "speaker": "Mr. Richard Cornelius Suwandi", "designation": "PhD candidate", "affiliation": "CUHK-Shenzhen", "title": "Can AI Agents Discover New Scientific Models?", "tracks": ["AI → Science"], "abstract": "Every machine learning model makes assumptions about its data. Gaussian process models are widely used for scientific forecasting and for deciding which experiment to run next. In these models, the assumptions live in a single function called a kernel. A good kernel matters most when data is scarce, which is the normal situation in science. Yet researchers still mostly choose one from a short list of textbook options.\n\nIn this talk I'll present Kernel Autoresearch (Kernaut), a system where AI coding agents invent new kernels as short Python programs. The hard part is validity, a kernel must satisfy mathematical conditions that no finite set of tests can confirm. In our stress tests, 22 to 58% of LLM-written kernels that passed numerical checks broke when we ran them at other scales or dimensions. I'll explain how Kernaut avoids this. The agent writes only one piece of the kernel, and trusted code assembles the rest in a way that guarantees the result is valid. An archive keeps the best kernels that behave in different ways, and a novelty check stops agents from rediscovering textbook kernels under new names.\n\nI'll walk through two scientific case studies. In enzyme kinetics, kernels discovered from ten known rate laws predict five unseen reaction mechanisms with almost half the error of a carefully tuned standard kernel. In glucose forecasting for simulated type 1 diabetes patients, a discovered kernel learns a delayed response to meals and an insulin effect that lasts about two hours. When only two training episodes per patient are available, discovered kernels cut forecast error by 38 to 67%. Each kernel is a short program, so we can read it, explain it and improve it by hand. I'll close with what this means for AI systems that propose scientific models we can verify and understand.\n\nThis is joint work with Feng Yin (CUHK-Shenzhen) and Kevin Murphy (UBC, Google DeepMind).\n\nPaper: https://arxiv.org/abs/2610.10394\nCode: https://github.com/richardcsuwandi/kernaut\nProject page: https://richardcsuwandi.github.io/kernaut/", "bio": "I'm a PhD candidate at the School of Artificial Intelligence, The Chinese University of Hong Kong, Shenzhen. I work on AI systems that help with scientific discovery. I want to understand how AI agents can discover new algorithms and models that scientists can actually verify, and how models can adapt their assumptions when experiments are expensive and data is scarce. My latest project, Kernel Autoresearch, is an autoresearch system that discovers interpretable models for open-ended scientific problems. Before that I built CAKE, which uses LLMs to design models for Bayesian optimization, the method behind many automated experiment and materials design pipelines. That work appeared at NeurIPS 2025. Beyond research, I co-founded the Institute for AI-Driven Discovery of Algorithms (AIDDA), a community and research network for AI-driven research systems. I previously led the AI4Science community at alphaXiv.", "resourceLinks": [{"url": "https://arxiv.org/abs/2610.10394", "label": "arXiv"}, {"url": "https://github.com/richardcsuwandi/kernaut", "label": "GitHub"}, {"url": "https://richardcsuwandi.github.io/kernaut/", "label": "Website"}], "speakerLinks": [{"url": "https://richardcsuwandi.github.io/", "label": "Website"}, {"url": "https://www.linkedin.com/in/richardcsuwandi/", "label": "LinkedIn"}, {"url": "https://twitter.com/richardcsuwandi", "label": "Website"}, {"url": "https://scholar.google.com/citations?user=28o0CkgAAAAJ", "label": "Google Scholar"}]}, {"id": "s04", "kind": "session", "day": 1, "block": "Block 1A: Clinical AI, Agentic Discovery & Public Data", "startUtc": "2026-11-27T02:40:00Z", "endUtc": "2026-11-27T03:00:00Z", "aedt": "1:40 PM - 2:00 PM", "jst": "11:40 AM - 12:00 PM", "ist": "8:10 AM - 8:30 AM", "mins": 20, "format": "Talk", "speaker": "Dr. Raju Varanasi & Temuulen Tuguldur", "designation": "Professor (Hon) Deakin University; PhD candidate, Deakin University", "affiliation": "Data De-Light P/L", "title": "From public data to policy development -AusInsight using Data Commons by Google", "tracks": ["SciComm & Policy"], "abstract": "Universities, Industry and government policy makers invest time and funds to build national capacity. AI science readiness of Australia is of prime interest for all stakeholders. Policy making is cross sectional and multi dimensional and it cuts across many public datasets: enrolments and completions, job advertisements, R&D spending, patents and graduate outcomes. \nThe data is public, but it sits with different publishers in different formats, and joining it can take weeks before any analysis starts. General-purpose AI chat tools do not solve this on their own: they can guess numbers and rarely show where a figure came from.\n\nAusInsight is a Data Commons instance built for the Australian Council of Deans of Science (ACDS) and presented at its satellite workshop at ANU, Canberra, on 26 October 2026. The Google Data Commons team built the instance, the web application and the natural-language data agent. Data Delight shaped the use cases and research questions, selected and sourced the public Australian data (Department of Education, Jobs and Skills Australia, ABS and others), and designed the storylines and pages. \n\nThe Australian data is joined with international indicators already available in Data Commons by Google. In this session we will show, live the instance, and how each indicator traces back to its source data and method; the data agent answering plain-English questions with charts and cited sources; two use cases. AI Science Readiness benchmarks Australia's STEM graduates, R&D spending and AI patents against peer countries. Competency Lag compares the supply of STEM graduates by field with labour-market demand. Its results are preliminary and illustrative: for example, science and IT graduates see the fewest job advertisements per new graduate of any field. \n\nWe frame this as a question of opportunity (how to create demand for a skilled pool), not a judgement on graduates or a causal claim.\n\nThe takeaway is practical: what it takes for a faculty, university or agency to stand up its own instance. Start from the questions, source and document the data, join local data with public data, test the agent before it meets an audience, and plan for long-term ownership. We will share what we learned taking a prototype from idea to live demo in about four weeks.\n\n\nLinks: Data Commons by Google, https://datacommons.org · Building your own instance, https://docs.datacommons.org/custom_dc/ · Data Delight, https://datadelight.org", "bio": "The first ever use cases based on Data Commons by Google and Australian datasets have been leveraged to demonstrate Australia's Science Readiness Index and Competency Lag  which have been demonstrated at the Australian Deans of Science Summit in October 2026 (Oct 26–28, 2026) with great success.\n\nDr. Raju Varanasi is the founder and director of Data Delight, an Australian data and AI consultancy for education, and has been a data and AI consultant to Google for Education since January 2024. He is also a Professor (Hon) at Deakin Business School. He works with education ministries and with university and school leaders on turning public and institutional data into evidence for decisions. \n\nMost recently he led Data Delight's contribution to AusInsight, a Data Commons instance for the Australian Council of Deans of Science, built with the Google Data Commons team. Before founding Data Delight he led the analytics transformation of the Parramatta Catholic school system in Sydney (80 schools, 43,000 students), including models that predicted senior school results a year ahead. He holds a PhD in Education from the University of Newcastle and a B.Tech in Chemical Engineering from IIT Delhi.\n\nCo-speaker: Temuulen Tuguldur is a PhD candidate at Deakin University, researching the governability of AI agents. Temuulen led Data Delight's data sourcing, storylines and page design for AusInsight and presented its Competency Lag use case at ACDS. Temuulen brings over eight years in data science and digital infrastructure, including national education data systems on Google Cloud.", "resourceLinks": [{"url": "https://datacommons.org", "label": "Website"}, {"url": "https://docs.datacommons.org/custom_dc/", "label": "Website"}, {"url": "https://datadelight.org", "label": "Website"}], "speakerLinks": [{"url": "https://www.datadelight.org", "label": "Website"}]}, {"id": "s05", "kind": "session", "day": 1, "block": "Block 1B: Earth Observation, Climate & Biomedical AI", "startUtc": "2026-11-27T03:00:00Z", "endUtc": "2026-11-27T03:20:00Z", "aedt": "2:00 PM - 2:20 PM", "jst": "12:00 PM - 12:20 PM", "ist": "8:30 AM - 8:50 AM", "mins": 20, "format": "Talk", "speaker": "Dr. Peter Scarth", "designation": "Co-founder and Remote Sensing Data Scientist", "affiliation": "Cibo Labs / Ozius / The University of Queensland", "title": "How Multi-Task Foundation-Models Learn Dynamic Ecological Condition", "tracks": ["AI → Science", "DeepTech & Quantum"], "abstract": "We use artificial intelligence, Vision-Language Models (VLMs), and machine-learning architectures to accelerate discoveries in the Earth and life sciences. We built an operational  platform from this research to solve long-term problems in ecosystem-condition assessments. Field transects measure fine-scale forest structure and coarse woody debris, but high costs limit their spatial extent. Continental satellite models cover large areas, but they compress the dynamic range of condition scores. They often give high scores to fertilised exotic pastures and give low scores to treeless natural ecosystems.\n\nOur platform combines five ecological and pastoral frameworks into one deep neural network. We process 40 m pixels with 64-dimensional embeddings from the Google DeepMind Alpha Earth Foundation model. We also calculate a cosine-similarity index from reference benchmarks across all 384 subregions of the Interim Biogeographic Regionalisation for Australia (IBRA). We trained this five-task network on 4.43 million records across all 87 Australian IBRA bioregions. A 2-layer shared trunk collects biological, structural, and spectral signals into one 384-dimensional representation of vegetation condition. The platform monitors five primary condition metrics. These metrics include tree canopy structure and woody debris for Queensland Spatial BioCondition, and fractional cover persistence for continental habitat condition. The model also monitors regional climax benchmark fidelity, floristic nativity from native plant species fractions, and pastoral pasture condition with four class probabilities. This shared trunk enables cross-task learning between forest biomass, cover persistence, and plant taxonomy. Four 64-dimensional sub-heads then convert this shared condition state into specific regulatory scores without cross-task errors. To expand our ground-truth data in remote rangelands, we combined 5,942 paddock photo-assessments from the LandLens VLM application with 2,009 agronomist transects. An automated supervisor script managed 201 trials of 5-fold spatial cross-validation on an NVIDIA A100 GPU. We scaled all losses to correct gradient mismatches, and spatio-temporal stratified sampling removed a significant dry-season bias in rangelands and croplands. We added 201,940 botanical plots and 108,404 non-native control sites to separate climax maturity from species nativity. Cumulative Ordinal Regression (CORN) calculates continuous pasture scores and four exact class probabilities that sum to 100%.\n\nThe platform processes 4.80 billion land pixels across Australia in 66 minutes on one NVIDIA A100 GPU. Independent spatial tests confirm high accuracy across all five predicted layers. Head 1 predicts Spatial BioCondition with a mean absolute error of 13.4 points and a weighted F1-score of 0.65. Head 2 predicts continental habitat condition with a balanced cross-validation loss of 12.8 points. Head 3 identifies undisturbed benchmark climax ecosystems with a binary cross-entropy loss of 0.369. Head 4 predicts floristic nativity and continuous ecosystem condition with 95.5% validation accuracy, correctly detecting 85.6% of non-native negative controls. Head 5 uses Cumulative Ordinal Regression to predict rangeland pasture condition with 0.817 QWK for the primary pasture component and exact multiclass accuracy  of 65.2% across 7,951 field and VLM ground-truth sites. These outputs directly support the Queensland Vegetation Management Act, Accounting for Nature accounts, UN SEEA-EA accounts, and the Australian Beef Sustainability Framework.\n\nFuture work building on this framework is proposed to combine cognitive linguistics enabled by LLMs, foundation-model interpretability, and spatial ecology to reframe how AI models represent condition. Standard environmental accounting treats nature as a passive object and reduces condition to static inventories. In contrast, verb-driven First Nations languages describe the landscape as an active network of continuous processes. We will use this relational grammar to model dynamic cycles of disturbance and recovery rather than rigid polygons. For example, our models will represent a savanna as an ongoing cycle of burning, resting, and regenerating. We will also assess multi-model embeddings to track multi-scale structural change and subtle bush encroachment. By framing condition this way, as an active living process, we create a cognitive guardrail against simple commodification and support reciprocal land stewardship.", "bio": "Peter Scarth is a remote sensing scientist, co-founder at Cibo Labs, and director at Ozius. He has more than 25 years of experience in Earth observation and environmental modelling across Australia. He developed national algorithms for Landsat and Sentinel-2 fractional groundcover, foliage projective cover, and structural vegetation classification. His work supports the Queensland Statewide Landcover and Trees Study and the Australian Beef Sustainability Framework. Currently, he uses satellite foundation models, multi-task deep neural networks, and vision-language models to measure natural capital and habitat condition across continental Australia.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.cibolabs.com.au", "label": "Website"}, {"url": "https://www.ozius.com.au", "label": "Website"}, {"url": "https://github.com/petescarth", "label": "GitHub"}, {"url": "https://www.linkedin.com/in/petescarth/", "label": "LinkedIn"}]}, {"id": "s06", "kind": "session", "day": 1, "block": "Block 1B: Earth Observation, Climate & Biomedical AI", "startUtc": "2026-11-27T03:20:00Z", "endUtc": "2026-11-27T03:30:00Z", "aedt": "2:20 PM - 2:30 PM", "jst": "12:20 PM - 12:30 PM", "ist": "8:50 AM - 9:00 AM", "mins": 10, "format": "Lightning / Demo", "speaker": "Dr. Sebastian Lopez Marcano", "designation": "Senior Manager Agriculture Analytics", "affiliation": "The University of Queensland", "title": "Satellites, AI and shared infrastructure for the Australian grains industry", "tracks": ["AI → Science"], "abstract": "Grains underpin food security across the Asia-Pacific. In Australia they make up about a quarter of agricultural production value and earn more than AUD 20 billion a year in exports. Yet growers farm the driest cropped continent under an increasingly variable climate. Adapting requires knowing what is growing where, when it flowers and how each season is tracking, across more than 20 million hectares. Analytics for the Australian Grains Industry (AAGI), a GRDC partnership with Curtin University, The University of Queensland and Adelaide University, is building the satellite, AI and data infrastructure to answer these questions at national scale.\n\nWe present three connected pieces of this work, each transferable to other crops and regions. First, we leverage geospatial foundation models, such as AlphaEarth Foundations Satellite Embeddings, with functional EO-AI-biophysical frameworks. Built on Google Earth Engine pipelines, these frameworks link satellite observations to interpretable crop traits such as crop type, flowering time and yield, so that predictions can be explained to and trusted by growers and agronomists. Second, we describe how AI-assisted development, paired with a gated expert review process, is helping AAGI produce high-quality packages and apps for growers, advisers and researchers. Finally, we demonstrate how these models and apps reach users through two portals: AAGIVerse, our open-source portal, and AAGIApps, an authenticated platform where each tool runs in its own container and serves users across seven partner organisations.", "bio": "I lead the design and development of AI-driven technologies for Australia’s productive sectors, including agriculture, aquaculture, and environment. My work focuses on scalable, interactive applications that support research and innovation through computer vision and data analytics. I’ve contributed and led national and international programs such as UQ-AAGI, UQ-APPN, FishID, EcoCommons (2026 Eureka Award Winner), and WildObs Australia, with support from Microsoft AI for Earth, the FAO, and the Gates Foundation.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/sebastianlopez-marcano", "label": "LinkedIn"}, {"url": "https://github.com/slopezmarcano", "label": "GitHub"}, {"url": "https://research-support.uq.edu.au/profile/15040/sebastian-lopez-marcano", "label": "Website"}]}, {"id": "s07", "kind": "session", "day": 1, "block": "Block 1B: Earth Observation, Climate & Biomedical AI", "startUtc": "2026-11-27T03:30:00Z", "endUtc": "2026-11-27T03:40:00Z", "aedt": "2:30 PM - 2:40 PM", "jst": "12:30 PM - 12:40 PM", "ist": "9:00 AM - 9:10 AM", "mins": 10, "format": "Lightning / Demo", "speaker": "Dr. Takayuki Shinohara", "designation": "Senior Researcher", "affiliation": "AIST", "title": "From Earth Observation to Engineering Decisions: Auditable AI Agents for Scientific Workflows", "tracks": ["AI → Science"], "abstract": "Scientific and engineering decisions increasingly depend on heterogeneous evidence: satellite observations, InSAR time series, 3D point clouds, infrastructure inspection records, predictive models, simulations, and geospatial databases. Large language models and AI agents offer a new way to connect these resources, but scientific use requires more than generating plausible answers. An AI system must retrieve the correct evidence, distinguish observations from predictions, respect physical and engineering constraints, expose uncertainty, and preserve provenance from source data to final decision.\n\nThis talk presents an auditable AI-agent architecture for connecting Earth observation and infrastructure science. I will use three classes of real research problems as case studies: reconstructing editable engineering models from 3D observations, forecasting infrastructure and environmental states from spatio-temporal data, and using tool-augmented AI agents to support infrastructure maintenance and disaster-related decisions.\n\nThe central design principle is to separate observations, learned models, external tools, verification, and decision-making rather than treating a large language model as a single autonomous decision maker. I will show how this separation helps detect practical failure modes such as stale observations, missing evidence, invalid infrastructure routes, inconsistent records, duplicated costs, and recommendations unsupported by the underlying data.\n\nThe session will also discuss how scientific agents can be evaluated through reproducible, failure-oriented benchmarks rather than answer accuracy alone. Examples will draw from our recent work on BridgeCode, Text2BridgeCAD, PS-InSAR forecasting, predictive bridge maintenance, and auditable urban infrastructure digital twins.\n\nThe broader goal is to show how agentic AI can serve as a traceable orchestration layer between scientific observations, domain models, engineering constraints, and human expertise.\n\nRepresentative publications and research software are available through my AIST profile, Google Scholar, and GitHub pages listed above.", "bio": "Takayuki Shinohara is a Senior Researcher at the National Institute of Advanced Industrial Science and Technology (AIST), Japan, working at the intersection of artificial intelligence, computer vision, Earth observation, and infrastructure engineering.\n\nHis research develops AI systems that transform heterogeneous scientific and engineering observations—including satellite imagery, InSAR time series, LiDAR and point clouds, inspection records, and geospatial data—into structured models and traceable decisions. His recent work includes BridgeCode and Text2BridgeCAD for generating editable bridge CAD/BIM models, LLM-based predictive bridge maintenance, PS-InSAR time-series forecasting, and auditable AI agents for infrastructure digital twins.\n\nHis broader research interest is in scientific AI systems that combine learned models with structured tools, physical and engineering constraints, provenance tracking, verification, and human oversight.", "resourceLinks": [], "speakerLinks": [{"url": "https://staff.aist.go.jp/shinohara.takayuki/", "label": "Website"}, {"url": "https://scholar.google.com/citations?hl=en&user=U7z9XykAAAAJ", "label": "Google Scholar"}, {"url": "https://www.linkedin.com/in/takayuki-shinohara-6b2223104/", "label": "LinkedIn"}, {"url": "https://github.com/shnhrtkyk", "label": "GitHub"}]}, {"id": "s08", "kind": "session", "day": 1, "block": "Block 1B: Earth Observation, Climate & Biomedical AI", "startUtc": "2026-11-27T03:40:00Z", "endUtc": "2026-11-27T04:00:00Z", "aedt": "2:40 PM - 3:00 PM", "jst": "12:40 PM - 1:00 PM", "ist": "9:10 AM - 9:30 AM", "mins": 20, "format": "Talk", "speaker": "Dr. Syeda Faiza Nasim", "designation": "Head of School Computing/Assistant Professor", "affiliation": "International College of Excellence", "title": "AI for Climate Science: Leveraging Machine Learning and Large Language Models for Climate Data Analysis, Extreme Weather, and Climate Risk Assessment", "tracks": ["AI → Science"], "abstract": "Artificial intelligence is creating new opportunities to advance climate science by improving the analysis of large climate datasets, identifying complex patterns in climate variability, and enhancing our understanding of extreme weather events and climate risks. This session will explore how machine learning, large language models (LLMs), and AI-assisted analytical workflows can support scientific discovery in climate and environmental research.\n\nBuilding on climate and environmental research, the session will focus on practical applications of AI to climate model evaluation, historical climate trends, extreme temperature and precipitation events, and the assessment of regional climate risks. It will explore how AI techniques can complement traditional statistical methods and climate modelling approaches to identify patterns, evaluate model performance, detect biases, and extract meaningful insights from large-scale climate simulations, including CMIP6 and emerging CMIP7 datasets.\n\nThe session will also examine opportunities for developing reproducible AI-assisted workflows for climate data processing, visualization, statistical analysis, and scientific interpretation. Potential applications include machine-learning-based climate model evaluation, AI-assisted detection of climate extremes, and the use of LLMs and agentic workflows to support scientific coding, documentation, and literature synthesis. Attention will be given to the challenges of data quality, uncertainty, interpretability, and scientific validation to ensure that AI-generated insights remain physically meaningful and scientifically robust.\n\nThe session welcomes researchers, students, and practitioners working at the intersection of artificial intelligence, climate science, environmental modelling, and sustainability. Participants will be encouraged to discuss potential collaborative projects, share computational tools and workflows, and identify opportunities to use AI to accelerate climate research and improve evidence-based decision-making in a changing climate.", "bio": "I am a PhD-qualified academic, researcher, and academic leader specializing in Artificial Intelligence, Machine Learning, Precision Agriculture, Remote Sensing, and Intelligent Decision Support Systems.My research focuses on applying AI and data-driven technologies to real-world challenges in agriculture and climate resilience. My doctoral research developed an intelligent irrigation decision-support framework integrating satellite remote sensing, IoT, machine learning, and environmental indicators to support sustainable water management and precision cotton production. My work aligns with the broader goals of climate-smart agriculture, sustainable resource management, SDG 2 (Zero Hunger), and SDG 13 (Climate Action).Beyond research, I am actively engaged in higher education, academic leadership, curriculum development, teaching, research supervision, and programme coordination. I currently contribute to computing education and academic leadership, with experience across Computer Science, Artificial Intelligence, Data Science, Machine Learning, Algorithms, Cybersecurity, and software development. I also contribute to the academic community as a peer reviewer and technical programme committee member for international journals and conferences. My academic service includes reviewing research manuscripts, participating in technical programme committees, and contributing to research quality and scholarly evaluation.\n\n\n\nMy research interests include:\n\n• Artificial Intelligence & Machine Learning\n\n• Precision & Smart Agriculture\n\n• Remote Sensing & Earth Observation\n\n• IoT and Intelligent Decision Support Systems\n\n• Climate-Smart Agriculture & Climate Resilience\n\n• Data Science and Predictive Analytics\n\n• AI for Sustainable Development\n\n\n\nI am particularly interested in interdisciplinary research and collaborations that connect AI with agriculture, environmental sustainability, climate resilience, and emerging intelligent technologies. I am open to research collaborations, postdoctoral opportunities, visiting researcher positions, academic partnerships, and projects at the intersection of AI, machine learning, remote sensing, IoT, and sustainable development.\n\n🔗 https://sfnportfolio.netlify.app/", "resourceLinks": [], "speakerLinks": [{"url": "https://sfnportfolio.netlify.app/", "label": "Website"}]}, {"id": "s09", "kind": "session", "day": 1, "block": "Block 1B: Earth Observation, Climate & Biomedical AI", "startUtc": "2026-11-27T04:00:00Z", "endUtc": "2026-11-27T04:20:00Z", "aedt": "3:00 PM - 3:20 PM", "jst": "1:00 PM - 1:20 PM", "ist": "9:30 AM - 9:50 AM", "mins": 20, "format": "Talk", "speaker": "Ms. Pravitha Kasu Sivanandan", "designation": "Statistical Programmer", "affiliation": "Statnomos Technologies", "title": "Visual Pre-Migration Assessment and LLM-Assisted SAS-to-R Conversion Framework for ADaM Programs", "tracks": ["AI → Science"], "abstract": "Migration of ADaM programs from SAS to R requires substantial effort before coding begins, particularly when programmers must interpret complex derivations, understand legacy design decisions, and navigate SAS-specific processing patterns embedded within code that has evolved over many years.\nThis work proposes a visual pre-migration assessment framework that leverages existing SAS ADaM programs, ADaM specifications, source SDTM datasets, and associated metadata to make migration complexity visible before R development begins. The framework identifies and visualizes cross-domain dependencies, merge structures, conditional derivations, ordering dependencies, missing-value & date handling and SAS-specific constructs such as arrays, macros, and PROC SQL.\nIt converts years of programming knowledge into interactive maps; aids programmers understand code and data relationships before coding in R. These visualizations help teams pinpoint migration hotspots and develop targeted review strategies. Additionally, the framework uses Large Language Models (LLMs) to enhance migration readiness, providing explanations of derivation logic, summarizing SAS program intent, and highlighting SAS-to-R semantic differences. By using structured metadata for LLM prompts, it improves clarity and aids in code translation by contextualizing data dependencies.\nAn interactive R Shiny interface combines visualization and AI capabilities into a unified workflow, highlighting key semantic differences between SAS and R. Future enhancements will offer R implementation guidance, automate migration test scenarios, and ensure traceability from pre-migration assessments to SAS-to-R reconciliation, fostering a scalable and auditable migration process.", "bio": "Pravitha Kasu Sivanandan is a Statistical Programmer at Statnomos Technologies, where she works on clinical data standards and statistical programming, with a growing focus on AI-assisted SAS-to-R conversion for CDISC ADaM workflows. She is developing a visual pre-migration assessment framework that explores how large language models (LLMs) can help analyze programming logic, study specifications, source datasets and metadata to identify complexities and potential inconsistencies before migration.\n\nWith an academic background in Bioinformatics and Biotechnology, she brings experience in cancer genomics, clinical variant interpretation and biomedical research, complemented by research experience in augmented-reality-based presurgical planning at IIT Madras. Her interests lie in applying AI responsibly to scientific and clinical data workflows, with an emphasis on transparency, interpretability, and human oversight.\n\nBeyond her professional work, she enjoys exploring new places and cultures, engaging with people from diverse backgrounds, pursuing lifelong learning, capturing perspectives through photography, discovering music, learning the ukulele and exploring her creativity through cooking.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/pravitha-k-sivanandan-7b2643165/", "label": "LinkedIn"}]}, {"id": "s10", "kind": "session", "day": 1, "block": "Block 1B: Earth Observation, Climate & Biomedical AI", "startUtc": "2026-11-27T04:20:00Z", "endUtc": "2026-11-27T04:40:00Z", "aedt": "3:20 PM - 3:40 PM", "jst": "1:20 PM - 1:40 PM", "ist": "9:50 AM - 10:10 AM", "mins": 20, "format": "Talk", "speaker": "Dr. Chintan M. Bhatt", "designation": "Lecturer in EEECS", "affiliation": "Queen's University Belfast", "title": "Beyond Accuracy: Building Explainable AI for Real-World Scientific Discovery", "tracks": ["AI → Science", "Science → AI", "DeepTech & Quantum"], "abstract": "Artificial intelligence (AI) is transforming scientific research by enabling researchers to analyse complex data, identify hidden patterns, and support evidence-based discovery. However, high predictive accuracy alone is insufficient when AI systems must support scientific interpretation, transparency, and reliable decision-making. This session explores how explainable artificial intelligence (XAI), machine learning, and computer vision can be combined to develop AI systems that offer not only predictions but also meaningful insights into their decisions. Through practical examples from visual recognition and healthcare-oriented AI research, the session will examine how explanation techniques can help researchers understand model behaviour, investigate potential biases, and assess the reliability of AI-generated outputs. It will also discuss key challenges, including the consistency of explanations, the risk of misleading interpretations, and the gap between model transparency and genuine scientific understanding. Participants will gain a practical perspective on integrating explainability into AI research workflows, evaluating models beyond conventional performance metrics, and designing systems that better support human expertise. The central message is that effective AI for science should do more than produce accurate results: it should help researchers understand, scrutinise, and responsibly use those results to advance scientific discovery.", "bio": "Dr. Chintan Bhatt is a Lecturer in Artificial Intelligence at Queen’s University Belfast, GIFT City Campus, India, and a Senior Member of IEEE. With over 15 years of experience in teaching and research, his expertise spans machine learning, computer vision, explainable artificial intelligence (XAI), and data science. His research focuses on developing innovative AI-driven solutions for real-world challenges, with contributions across interdisciplinary applications. He has supervised and mentored undergraduate, postgraduate, and doctoral researchers and actively contributes to academic research and collaboration. In recognition of his research impact, he was included in the Stanford–Elsevier Top 2% Scientists List in both 2025 and 2026.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/chintan-bhatt-phd-336b3122/", "label": "LinkedIn"}]}, {"id": "s11", "kind": "session", "day": 1, "block": "Block 1B: Earth Observation, Climate & Biomedical AI", "startUtc": "2026-11-27T04:40:00Z", "endUtc": "2026-11-27T05:00:00Z", "aedt": "3:40 PM - 4:00 PM", "jst": "1:40 PM - 2:00 PM", "ist": "10:10 AM - 10:30 AM", "mins": 20, "format": "Talk", "speaker": "Ms. G. Pavithra", "designation": "Senior Technical Staff", "affiliation": "TANUH-AI, IISc, Bengaluru", "title": "Generative AI for Privacy-Preserving Medical Imaging: Enabling Collaborative and Trustworthy Healthcare AI", "tracks": ["AI → Science", "DeepTech & Quantum", "SciComm & Policy"], "abstract": "Beyond Data Sharing: Generative AI for Privacy-Preserving Medical Imaging\n\nThis is an emerging and rapidly growing research area, with increasing interest in leveraging generative AI for privacy-preserving medical imaging and trustworthy healthcare innovation.\n\nArtificial intelligence is transforming scientific discovery, particularly in medical imaging, where deep learning enables image reconstruction, denoising, segmentation, and computer-aided diagnosis. However, developing reliable medical AI requires large, diverse, and well-annotated datasets. Patient confidentiality, ethical requirements, and institutional restrictions often limit the sharing of medical images, creating a fundamental challenge: how can we advance medical research without compromising patient privacy?\n\nThis session explores how Generative Artificial Intelligence (GenAI) can help address this challenge, with a focus on synthetic medical image generation, diffusion models, and privacy-preserving collaborative learning. It will introduce the fundamentals of generative models and explain how diffusion-based approaches can synthesise realistic medical images, potentially augment limited datasets and support the development of downstream AI models. Applications such as MRI and CT image synthesis, denoising, and super-resolution will illustrate how these techniques can contribute to scientific research and healthcare innovation.\n\nThe session will also examine how generative modelling can complement federated learning, which enables multiple hospitals to collaboratively train AI models without directly exchanging their raw patient data. Differential privacy and related safeguards will be introduced to explain how privacy risks can be reduced during model training and data generation. Particular attention will be given to an important limitation: synthetic medical images are not automatically privacy-preserving. Generative models may memorise training examples, expose sensitive information, or underrepresent rare diseases and patient populations. Consequently, privacy evaluation, clinical validity, fairness, and the balance between data utility and privacy must be considered together.\n\nDrawing on developments in medical image restoration and efficient deep learning, the session will connect these methods to practical challenges in building trustworthy medical AI systems, including data scarcity, computational constraints, and deployment in resource-limited healthcare settings. Participants will gain an understanding of the opportunities and limitations of GenAI for privacy-aware scientific discovery and identify potential research directions at the intersection of generative modelling, medical imaging, and trustworthy AI.\n\nSelected papers and resources\n\n1. Kaissis et al., [Secure, privacy-preserving and federated machine learning in medical imaging](https://www.nature.com/articles/s42256-020-0186-1), *Nature Machine Intelligence*, 2020.\n2. Shi et al., [Privacy-Preserving Latent Diffusion-Based Synthetic Medical Image Generation](https://pmc.ncbi.nlm.nih.gov/articles/PMC13034593/), *IEEE Transactions on Medical Imaging*, 2026.\n3. Dombrowski and Kainz, [Can Diffusion Models Generalize? Privacy and Fairness Trade-offs for Medical Data Sharing](https://proceedings.mlr.press/v301/dombrowski26a.html), MIDL 2026.\n4. [PriMIA: Privacy-Preserving Machine Learning for Medical Images](https://gkaissis.github.io/PriMIA/) — a practical framework for federated and privacy-preserving medical imaging research.\n5. [Privacy and fairness auditing code](https://github.com/MischaD/Privacy) — resources for evaluating memorisation and fairness in generative medical imaging.\n\nThe session is intended for researchers, students, and practitioners interested in AI for science, medical imaging, generative models, and responsible healthcare innovation.", "bio": "G. Pavithra is a researcher at TANUH AI, IISc Bengaluru, a collaborative initiative by the Ministry of India with IISc to focus on AI in healthcare. She is an M.Tech. graduate in Artificial Intelligence from the Indian Institute of Science (IISc), Bengaluru, where she worked under Dr. Kunal Narayan Chaudhury on optimization-aware deep image restoration, with a particular focus on convex regularization and learned image priors. She finished her B.Tech. (Hons.) in CSE from NIT Trichy. Her research interests include image restoration, inverse problems, medical image analysis, and optimization for deep learning. She has presented her research at international conferences, including MIDL 2026, and received the Best Paper Award at IEEE TENSYMP 2026 for her work on bridging convex variational priors and deep networks for image deblurring. She has also received Best Paper Awards for her research in lightweight medical image segmentation. At IISc, she has served as a Teaching Assistant for the graduate courses Computational Methods of Optimisation and Advanced Image Processing, gaining experience in teaching optimization concepts and mentoring students. Her research focuses on developing efficient, trustworthy, and deployable AI systems for real-world medical imaging applications.", "resourceLinks": [{"url": "https://www.nature.com/articles/s42256-020-0186-1", "label": "Website"}, {"url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC13034593/", "label": "Website"}, {"url": "https://proceedings.mlr.press/v301/dombrowski26a.html", "label": "Website"}, {"url": "https://gkaissis.github.io/PriMIA/", "label": "Website"}, {"url": "https://github.com/MischaD/Privacy", "label": "GitHub"}], "speakerLinks": [{"url": "https://www.linkedin.com/in/g-pavithra-703522191/", "label": "LinkedIn"}, {"url": "https://scholar.google.com/citations?user=7qvLcToAAAAJ&hl=en", "label": "Google Scholar"}, {"url": "https://www.semanticscholar.org/author/Pavithra-Gurushankar/2275456456", "label": "Website"}, {"url": "https://orcid.org/0000-0003-0643-7185", "label": "ORCID"}]}, {"kind": "break", "day": 1, "block": "Block 1B: Earth Observation, Climate & Biomedical AI", "startUtc": "2026-11-27T05:00:00Z", "endUtc": "2026-11-27T06:30:00Z", "aedt": "4:00 PM - 5:30 PM", "jst": "2:00 PM - 3:30 PM", "ist": "10:30 AM - 12:00 PM", "mins": 90, "title": "Natural Timezone Transition Break (90m — Resumes at 5:30 PM AEDT / 12:00 PM IST)"}, {"id": "s12", "kind": "session", "day": 1, "block": "Block 1C: Scientific Simulation, Quantum ML & Human-Centric AI", "startUtc": "2026-11-27T06:30:00Z", "endUtc": "2026-11-27T06:50:00Z", "aedt": "5:30 PM - 5:50 PM", "jst": "3:30 PM - 3:50 PM", "ist": "12:00 PM - 12:20 PM", "mins": 20, "format": "Talk", "speaker": "Mr. Vinay Kumar", "designation": "PhD Scholar", "affiliation": "Indian Institute of Technology Delhi", "title": "Benchmarking AI Agents for Molecular Dynamics Simulations", "tracks": ["AI → Science"], "abstract": "The promise of AI-driven scientific discovery hinges on whether AI agents can autonomously design and execute the computational workflows that underpin modern science. Molecular dynamics (MD) simulation provides a demanding test of this capability: it requires translating a physical problem into syntactically and semantically correct input scripts, choosing force fields, ensembles, and initial and boundary conditions, diagnosing engine errors and unstable trajectories, and interpreting outputs against known physical behavior. We introduce MDGYM, a benchmark of 200 expert-curated MD simulation problems in LAMMPS and GROMACS, two widely used MD engines, organized into three difficulty levels and comprising 366 target quantities scored against reference values from expert simulations. We evaluate three general-purpose command-line agent frameworks, Claude Code, Codex, and OpenHands, each with four LLMs. The best configuration solves 68% of easy problems, 30% of medium problems, and 21% of hard problems, and the choice of model changes performance far more than the choice of framework. Trajectory and engine-error analyses show that most engine errors arise while agents assemble the simulation input, that weaker models fail early through syntax errors and premature termination, and that stronger models complete more simulations but report incorrect values from error-free runs. Current agents therefore lack three capabilities required for autonomous simulation: coherent specification of simulation inputs, domain-aware recovery from engine errors, and physical and methodological validation of results.", "bio": "Vinay is a India AI PhD Fellow at Yardi School of AI, IIT Delhi. His work is focused on building agentic AI frameworks for autonomous scientific discovery, with papers accepted at NeurIPS 2026. He is an awardee of Yardi Honorarium for Academic Excellence. He graduated from CSE Dept of IIT Ropar where his research was focused on cost effective collaboration in Human-AI teams.", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/kvinay07/", "label": "LinkedIn"}]}, {"id": "s13", "kind": "session", "day": 1, "block": "Block 1C: Scientific Simulation, Quantum ML & Human-Centric AI", "startUtc": "2026-11-27T06:50:00Z", "endUtc": "2026-11-27T07:10:00Z", "aedt": "5:50 PM - 6:10 PM", "jst": "3:50 PM - 4:10 PM", "ist": "12:20 PM - 12:40 PM", "mins": 20, "format": "Talk", "speaker": "Ms. Usha Ramani Vemuru", "designation": "Founder", "affiliation": "Gurujada", "title": "AI Can Explain Science — But Can It Help Us Think Like Scientists?", "tracks": ["SciComm & Policy"], "abstract": "AI can explain a scientific concept in seconds. However, genuine scientific understanding requires questioning assumptions, developing hypotheses, interpreting evidence, and learning from mistakes. When two learners arrive at the same correct answer—one grasping the scientific principle and the other relying on memorization or instant AI output—how can learning systems recognize the difference?\n\nThis session explores how AI systems can make scientific reasoning visible rather than simply delivering final answers. We examine how passive content (such as a chemical equilibrium lecture) can be transformed into structured scientific inquiry where learners predict outcomes, articulate hypotheses, receive guided feedback, and iterate—using attempts, misconceptions, and retries as interpretable signals for educators and researchers.", "bio": "Usha Ramani Vemuru is an educator, entrepreneur and community leader working at the intersection of AI, education and technology.\n\nA former engineering professor, she is the co-founder of GURUJADA, an AI-enabled learning platform exploring how technology can help educators make learners' thinking visible, identify learning gaps and provide meaningful guidance at scale.\n\nShe leads Google Developer Groups Vizag and Women Techmakers Vizag, building communities that connect technology, learning and innovation. Through her podcast, Learning Paths, she engages with educators to explore how AI is transforming teaching and learning.\n\nHer current work focuses on an important question: how can AI help people develop genuine understanding rather than simply access instant answers?", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/vusharamani", "label": "LinkedIn"}]}, {"id": "s14", "kind": "session", "day": 1, "block": "Block 1C: Scientific Simulation, Quantum ML & Human-Centric AI", "startUtc": "2026-11-27T07:10:00Z", "endUtc": "2026-11-27T07:30:00Z", "aedt": "6:10 PM - 6:30 PM", "jst": "4:10 PM - 4:30 PM", "ist": "12:40 PM - 1:00 PM", "mins": 20, "format": "Talk", "speaker": "Mr. Anitya Kumar Gupta", "designation": "Research Associate", "affiliation": "Shoolini University", "title": "Beyond Binary Feelings: Hybrid Quantum–Classical Machine Learning for Emotion Understanding", "tracks": ["AI → Science", "Science → AI", "SciComm & Policy"], "abstract": "Human emotions are not binary. A single sentence can carry sarcasm, hope, and frustration at once, yet most sentiment models still reduce language to positive, negative, or neutral. This talk presents research on hybrid quantum–classical approaches to sentiment and emotion analysis. The idea is that quantum concepts such as superposition and entanglement offer a natural mathematical language for ambiguous, overlapping, context-dependent emotional states.\n\nThe session starts with the limits of conventional NLP pipelines on mixed and subtle emotions. It then shows how text features can be encoded into parameterised quantum circuits and combined with classical neural layers in a hybrid architecture, and covers what can realistically be run on today’s simulators and noisy quantum hardware. It also discusses where quantum methods help, where they don’t yet, and the open problems that matter most: data encoding, scalability, and noise.\n\nAttendees will leave with a clear view of where quantum machine learning stands for NLP, a practical framework for evaluating hybrid models, and research directions they can pursue themselves.", "bio": "Anitya Kumar Gupta is a Research Associate and PhD scholar at Shoolini University, Himachal Pradesh. His doctoral research, Sentiments and Emotions Analysis Through Quantum Techniques, develops hybrid classical–quantum machine learning models for understanding human emotion. He holds an M.S. in Computer Science from the Illinois Institute of Technology.\n\nHis AI for Science work sits at the intersection of quantum machine learning, NLP, and IoT security. He currently leads research on securing AI systems used for carbon measurement and reporting, which connects trustworthy AI with climate science. He also works on agentic AI for cybersecurity, aligned with UN SDGs 9, 13, and 16. He holds seven patents across India and the UK and has published with IEEE, Springer Nature, and Taylor & Francis.\n\nHe coordinates the National Quantum Training Programme with CDAC Bangalore, founded Shoolini’s Student Research Council, and teaches data science and AI courses. Earlier, he worked at DIPR-DRDO and was a Program Manager at CodePath.org in California. His recognitions include NITI Aayog’s Mentor Beyond Measure Award (2025).", "resourceLinks": [], "speakerLinks": [{"url": "https://www.linkedin.com/in/anitya-gupta/", "label": "LinkedIn"}]}, {"id": "s15", "kind": "session", "day": 1, "block": "Block 1C: Scientific Simulation, Quantum ML & Human-Centric AI", "startUtc": "2026-11-27T07:30:00Z", "endUtc": "2026-11-27T07:50:00Z", "aedt": "6:30 PM - 6:50 PM", "jst": "4:30 PM - 4:50 PM", "ist": "1:00 PM - 1:20 PM", "mins": 20, "format": "Talk", "speaker": "Dr. A Seshaditya", "designation": "Data Science", "affiliation": "quasi ai (Nubri GmbH)", "title": "Combining Quantum and Physics-Inspired AI (PINN) models for Crystal growth Simulations", "tracks": ["AI → Science", "DeepTech & Quantum"], "abstract": "Developing the hybrid quantum-classical AI methods for engineering simulations in the space and energy sectors, focusing on accelerating Computational Fluid Dynamics (CFD) and multi-physics simulations. My research combines Scientific Machine Learning (Physics-Informed Neural Networks and Neural Operators) with quantum computing to develop scalable surrogate models for silicon crystal growth in semiconductor manufacturing and cryogenic liquid hydrogen storage for aerospace and clean energy applications. The long-term goal is to enable real-time, physics-constrained digital twins that can significantly reduce simulation time, support design optimization, and improve the efficiency and reliability of next-generation energy and space systems.\n\nwe are validating the Quantum Physics-Inspired AI models for accelerating the CFD simulations for silicon crystal growth (CZ method). we have trained the Hybrid quantum classical models (16-qubit circuits) on both Nvidia GPU emulators and then on IBM quantum hardware  https://github.com/masapasa/qcpinn-convection-diffusion-qiskit", "bio": "Academic background in Quantum and Computational Chemistry (PhD TU Berlin) and now working at the intersection of Scientific Machine Learning, Computational Fluid Dynamics, and quantum computing. I am the founder of Quasi Digital, where we develop quantum physics-inspired AI models for accelerating engineering simulations in semiconductor crystal growth and cryogenic hydrogen storage, with the long-term goal of enabling real-time digital twins for industrial applications.", "resourceLinks": [{"url": "https:/
