<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APAC AI for Science DevFest 2026 — Speaker Program &amp; Abstracts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="google-accent-bar"></div>

  <section class="controls-wrapper" aria-label="Program search and filters">
    <div class="container">
      <div class="controls-row-main">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input"
            placeholder="Search by topic, method (e.g. PINN, RAG, molecular dynamics, VLM), speaker, or institution..."
            autocomplete="off" />
          <button id="clearSearchBtn" class="clear-search" title="Clear search"
            aria-label="Clear search">&times;</button>
        </div>

        <div class="tz-select-wrap">
          <label for="formatSelect" class="tz-label">Format:</label>
          <select id="formatSelect" class="select-control">
            <option value="ALL">All Formats</option>
          </select>
        </div>

        <div class="tz-select-wrap">
          <label for="tzSelect" class="tz-label">Timezone:</label>
          <select id="tzSelect" class="select-control">
            <option value="LOCAL">My Local Time</option>
            <option value="Australia/Sydney">AEDT — Sydney (UTC+11)</option>
            <option value="Asia/Tokyo">JST / KST — Tokyo &amp; Seoul (UTC+9)</option>
            <option value="Australia/Perth">AWST / SGT — Perth &amp; Singapore (UTC+8)</option>
            <option value="Asia/Kolkata">IST — India (UTC+5:30)</option>
            <option value="Europe/Berlin">CET — Berlin &amp; Paris (UTC+1)</option>
            <option value="UTC">UTC</option>
            <option value="America/New_York">EST — US East (UTC-5)</option>
            <option value="America/Los_Angeles">PST — US West (UTC-8)</option>
          </select>
        </div>
      </div>

      <div class="controls-row-filters">
        <div class="chip-group" role="tablist" aria-label="Day filter">
          <div class="day-tabs">
            <button class="day-tab active" data-day="ALL">All Days</button>
            <button class="day-tab" data-day="1">Day 1 · Fri 27 Nov</button>
            <button class="day-tab" data-day="2">Day 2 · Sat 28 Nov</button>
          </div>
          <button class="chip" id="savedFilterBtn" title="Show your saved sessions">
            <span>★ Saved</span>
            <span id="savedCountBadge">(0)</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <main class="container">
    <div class="status-bar">
      <div id="resultsSummary">Loading sessions...</div>
      <div class="utility-btns">
        <button class="btn-text" id="expandAllBtn">Expand all abstracts</button>
        <button class="btn-text" id="resetFiltersBtn" style="display:none">Reset filters</button>
      </div>
    </div>

    <div id="programContainer"></div>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>

</html>
